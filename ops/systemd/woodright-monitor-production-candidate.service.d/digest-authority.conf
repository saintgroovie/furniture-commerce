# digests and expected_application_source_sha (application_source_sha and/or
# approved_git_sha) against active containers. Temporary REQUIRE=0 was a
# pre-manifest workaround and must not remain after ownership manifests exist.
Environment=WOODRIGHT_REQUIRE_EXPECTED_DIGEST=1
