# Woodright image build profile: PUBLIC_PRODUCTION
# Consumed by scripts/release/resolve-image-build-profile.cjs (fail-closed) and
# .github/workflows/build-staging-images.yml (build_profile=public_production).
# Non-secret KEY=value only. Tracked in Git. Never put publishable keys or
# other credentials in this file - those stay in GitHub Environment secrets.
#
# This profile bakes the FUTURE public buyer site (woodright.ru) as
# public_indexable. It does NOT authorize DNS/traffic cutover. Deploy the
# resulting images only to the isolated woodright-public-production stack
# (loopback / operator validation) until a separate owner GO.

WOODRIGHT_IMAGE_BUILD_PROFILE=public_production
WOODRIGHT_ENVIRONMENT_AUTHORITY=public_production

# Compile-time NEXT_PUBLIC_* bake (browser bundle - never secret).
NEXT_PUBLIC_SITE_URL=https://woodright.ru
NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.woodright.ru
MEDUSA_BACKEND_URL=http://backend:9000
MEDUSA_BACKEND_INTERNAL_URL=http://backend:9000

# Public-launch contract bake (indexable). Legal/payment owner decisions remain
# separate runtime gates and do not block this bake profile.
WOODRIGHT_LAUNCH_MODE=public_indexable
WOODRIGHT_PAYMENT_MODE=manual_invoice
WOODRIGHT_ADMIN_EXPOSURE=private

# Runtime identity evidence baked as image ENV defaults (compose overrides win).
WOODRIGHT_RUNTIME_ROLE=public_production
WOODRIGHT_RUNTIME_EXPOSURE=public
WOODRIGHT_DB_ALIAS=public_production_db

# Profile-value forbidden substrings (SITE/API must not contain these).
WOODRIGHT_FORBIDDEN_SITE_SUBSTRINGS=woodright-demo.ru,127.0.0.1,localhost
