# Woodright image build profile: PUBLIC_DEMO
# Consumed by scripts/release/resolve-image-build-profile.cjs (fail-closed) and
# .github/workflows/build-staging-images.yml (build_profile=public_demo input).
# Non-secret KEY=value only. Tracked in Git. Never put publishable keys or
# other credentials in this file - those stay in GitHub Environment secrets.
#
# RCA this profile fixes: the pre-2026-07-31 workflow baked NEXT_PUBLIC_SITE_URL
# from a single `environment: staging` secret (STAGING_NEXT_PUBLIC_SITE_URL =
# https://woodright-demo.ru) for EVERY build, with no WOODRIGHT_LAUNCH_MODE
# bake at all - so apps/storefront/Dockerfile's launch-contract gate was
# silently skipped, and the same images/secret were later (incorrectly) reused
# as "production-candidate" images. This profile file is now the only source
# of truth for public_demo's baked URLs; the workflow no longer reads
# STAGING_NEXT_PUBLIC_SITE_URL for the site URL.

WOODRIGHT_IMAGE_BUILD_PROFILE=public_demo
WOODRIGHT_ENVIRONMENT_AUTHORITY=public_demo

# Compile-time NEXT_PUBLIC_* bake (browser bundle - never secret, always the
# buyer-facing demo host). Server-only MEDUSA_BACKEND_* stay Docker-internal.
NEXT_PUBLIC_SITE_URL=https://woodright-demo.ru
NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.woodright-demo.ru
MEDUSA_BACKEND_URL=http://backend:9000
MEDUSA_BACKEND_INTERNAL_URL=http://backend:9000

# Public-launch contract (apps/storefront/src/lib/launch-contract.ts). The
# demo is intentionally noindex + manual-invoice regardless of its public
# WOODRIGHT_RUNTIME_EXPOSURE below - it is a buyer-facing preview, not the
# real public launch.
WOODRIGHT_LAUNCH_MODE=private_noindex
WOODRIGHT_PAYMENT_MODE=manual_invoice
WOODRIGHT_ADMIN_EXPOSURE=private

# Runtime identity evidence baked as image ENV defaults (labels/evidence only -
# apps/storefront/src/lib/runtime-identity-headers.ts reads the *runtime*
# WOODRIGHT_RUNTIME_ROLE / WOODRIGHT_EXPOSURE / WOODRIGHT_DATABASE_IDENTITY
# env set by docker-compose at container start, which takes precedence over
# these Dockerfile-baked defaults).
WOODRIGHT_RUNTIME_ROLE=public_demo
WOODRIGHT_RUNTIME_EXPOSURE=public
WOODRIGHT_DB_ALIAS=public_demo_db

# Contamination-scan forbidden substrings for THIS profile's own bundle
# (scripts/release/scan-storefront-contamination.cjs). woodright.ru is the
# real production apex and must never leak into a public_demo image; loopback
# hosts must never leak into any published image.
# note: woodright.ru is forbidden here as the PRODUCTION apex host - this is
# the demo profile, so its own canonical host (woodright-demo.ru) is naturally
# expected/required, not forbidden.
WOODRIGHT_FORBIDDEN_SITE_SUBSTRINGS=woodright.ru,127.0.0.1,localhost
