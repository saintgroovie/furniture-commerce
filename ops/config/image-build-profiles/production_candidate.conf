# Woodright image build profile: PRODUCTION_CANDIDATE
# Consumed by scripts/release/resolve-image-build-profile.cjs (fail-closed) and
# .github/workflows/build-staging-images.yml (build_profile=production_candidate input).
# Non-secret KEY=value only. Tracked in Git. Never put publishable keys or
# other credentials in this file - those stay in GitHub Environment secrets.
#
# This is NOT a public woodright.ru cutover. It only controls what gets BAKED
# into the image (NEXT_PUBLIC_* compile-time values + the launch-contract
# gate). The image still deploys to the PRIVATE production-candidate stack
# (ops/config/runtime-environments/production.conf, class
# PRODUCTION_CANDIDATE, WOODRIGHT_RUNTIME_EXPOSURE=private) via
# ops/release/cutover-production-candidate.sh. DNS/Traefik public exposure
# remains a separate, explicitly approved action.
#
# RCA this profile fixes: the pre-2026-07-31 workflow always used
# `environment: staging` secrets (NEXT_PUBLIC_SITE_URL=https://woodright-demo.ru)
# and never baked WOODRIGHT_LAUNCH_MODE, so images that were later used as
# "production-candidate" images actually carried the demo host + a skipped
# launch-contract gate. This profile is the only source of truth for the
# production-candidate bake; the workflow never reads a "site URL" secret for
# this profile.

WOODRIGHT_IMAGE_BUILD_PROFILE=production_candidate
WOODRIGHT_ENVIRONMENT_AUTHORITY=production

# Compile-time NEXT_PUBLIC_* bake (browser bundle - never secret; this is the
# real production apex/API host, even though the runtime stack stays private
# until a separate DNS cutover). Server-only MEDUSA_BACKEND_* stay
# Docker-internal regardless of profile.
NEXT_PUBLIC_SITE_URL=https://woodright.ru
NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.woodright.ru
MEDUSA_BACKEND_URL=http://backend:9000
MEDUSA_BACKEND_INTERNAL_URL=http://backend:9000

# Public-launch contract (apps/storefront/src/lib/launch-contract.ts). Private
# production-candidate stays noindex + manual-invoice until a separate,
# explicitly approved public-launch decision changes these.
WOODRIGHT_LAUNCH_MODE=private_noindex
WOODRIGHT_PAYMENT_MODE=manual_invoice
WOODRIGHT_ADMIN_EXPOSURE=private

# Runtime identity evidence baked as image ENV defaults (labels/evidence only -
# apps/storefront/src/lib/runtime-identity-headers.ts reads the *runtime*
# WOODRIGHT_RUNTIME_ROLE / WOODRIGHT_EXPOSURE / WOODRIGHT_DATABASE_IDENTITY
# env set by docker-compose at container start, which takes precedence over
# these Dockerfile-baked defaults). Matches
# ops/config/runtime-environments/production.conf's
# WOODRIGHT_REQUIRED_EXPOSURE=private / WOODRIGHT_REQUIRED_DB_ALIAS.
WOODRIGHT_RUNTIME_ROLE=production_candidate
WOODRIGHT_RUNTIME_EXPOSURE=private
WOODRIGHT_DB_ALIAS=non_public_candidate_db

# Contamination-scan note: WOODRIGHT_FORBIDDEN_SITE_SUBSTRINGS below applies to
# PROFILE VALUE validation only (NEXT_PUBLIC_SITE_URL / API must not contain
# these). Post-build filesystem scan uses a different, stricter-with-scheme
# list in scripts/release/scan-storefront-contamination.cjs (https://woodright-demo.ru,
# 127.0.0.1:3200, public_demo_db) so launch-contract deny-lists and Next polyfills
# mentioning bare localhost/demo hosts do not false-fail a clean bake.
WOODRIGHT_FORBIDDEN_SITE_SUBSTRINGS=woodright-demo.ru,127.0.0.1,localhost
