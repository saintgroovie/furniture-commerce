# Woodright runtime environment profile: PRODUCTION_CANDIDATE (private)
# Explicit CLI: --environment production
# This is NOT public woodright.ru cutover. Public DNS mutation remains forbidden.
# Tracked in Git. No secrets.

WOODRIGHT_ENVIRONMENT=production
WOODRIGHT_ENVIRONMENT_CLASS=PRODUCTION_CANDIDATE
WOODRIGHT_ENVIRONMENT_PROVISIONED=1
WOODRIGHT_PUBLIC_EXPOSURE=private
WOODRIGHT_PRODUCTION_DATA=1

WOODRIGHT_DOKPLOY_COMPOSE_DIR=/etc/dokploy/compose/woodright-production
WOODRIGHT_COMPOSE_ENV_FILE=/etc/dokploy/compose/woodright-production/code/.env
WOODRIGHT_COMPOSE_FILE=/etc/dokploy/compose/woodright-production/code/docker-compose.yml
WOODRIGHT_COMPOSE_PROJECT=woodright-production
WOODRIGHT_COMPOSE_PROJECT_ALT=
WOODRIGHT_REQUIRE_COMPOSE_LABEL=1

WOODRIGHT_BE_NAME_PREFIX=woodright-production-
WOODRIGHT_SF_NAME_PREFIX=woodright-production-
WOODRIGHT_BE_CONTAINER_DEFAULT=woodright-production-backend
WOODRIGHT_SF_CONTAINER_DEFAULT=woodright-production-storefront
WOODRIGHT_REQUIRED_OWNER_LABEL=Dokploy
# Image labels may omit runtime-role; pin via compose project + name prefix + env role
WOODRIGHT_REQUIRED_RUNTIME_ROLE=
WOODRIGHT_REQUIRED_RUNTIME_ROLE_ENV=production_candidate
WOODRIGHT_REQUIRED_EXPOSURE=private
WOODRIGHT_REQUIRED_DB_ALIAS=non_public_candidate_db
WOODRIGHT_REQUIRED_BE_TITLE=woodright-backend
WOODRIGHT_REQUIRED_SF_TITLE=woodright-storefront

WOODRIGHT_NET_STACK=
WOODRIGHT_NET_DOKPLOY=dokploy-network
WOODRIGHT_MEDIA_VOLUME=woodright-production_woodright-production_media
WOODRIGHT_MEDIA_MOUNT_IN_BE=/server/static
WOODRIGHT_DB_NAME=woodright_production
WOODRIGHT_PG_CONTAINER_PREFIX=woodright-production-postgres

# No public buyer domain for this candidate; loopback only
WOODRIGHT_BUYER_HOST=http://127.0.0.1:3200
WOODRIGHT_API_HOST=http://127.0.0.1:9200
WOODRIGHT_CANONICAL_DOMAIN=
# FORBIDDEN_DOMAINS below is what actually protects against an accidental
# public bind for live Traefik - it stays exactly as-is until a real DNS
# cutover. Do not remove it to "activate" the metadata targets below.
WOODRIGHT_FORBIDDEN_DOMAINS=woodright.ru,www.woodright.ru,woodright-demo.ru,api.woodright-demo.ru

# --- Launch contract targets (metadata only - NOT a live DNS/Traefik bind) ---
# These describe the intended production shape for the storefront's launch
# contract (apps/storefront/src/lib/launch-contract.ts) and are consumed by
# scripts/release/check-public-launch-readiness.cjs / ops docs under
# ops/config/public-launch/. Setting them here does NOT publish anything:
# WOODRIGHT_FORBIDDEN_DOMAINS above and the loopback WOODRIGHT_BUYER_HOST /
# WOODRIGHT_API_HOST above remain the live guard until an explicit,
# separately approved DNS cutover changes them.
WOODRIGHT_LAUNCH_MODE=private_noindex
WOODRIGHT_CANONICAL_SITE_URL=https://woodright.ru
# Metadata-only target domain for the eventual cutover - distinct from the
# empty WOODRIGHT_CANONICAL_DOMAIN above, which stays empty until that
# cutover actually happens (see comment on WOODRIGHT_FORBIDDEN_DOMAINS).
WOODRIGHT_CANONICAL_DOMAIN_TARGET=woodright.ru
WOODRIGHT_PUBLIC_API_URL=https://api.woodright.ru
WOODRIGHT_ADMIN_EXPOSURE=private
WOODRIGHT_PAYMENT_MODE=manual_invoice
WOODRIGHT_LEGAL_CONTENT_STATUS=draft

WOODRIGHT_OWNERSHIP_DIR=/srv/woodright/runtime-ownership-production
WOODRIGHT_ACTIVE_OWNER=/srv/woodright/runtime-ownership-production/ACTIVE_OWNER.json
WOODRIGHT_EXPECTED_RELEASE=/srv/woodright/runtime-ownership-production/EXPECTED_RELEASE.json
WOODRIGHT_ACTIVE_RELEASE=/srv/woodright/runtime-ownership-production/ACTIVE_RELEASE.json
WOODRIGHT_IDENTITY_DIR=/srv/woodright/runtime-identity-production
WOODRIGHT_ACTIVE_PUBLIC=/srv/woodright/runtime-identity-production/ACTIVE_PUBLIC.json
WOODRIGHT_PUBLIC_DEMO_FILE=
WOODRIGHT_EVIDENCE_ROOT=/srv/woodright/reports/production
# Nested path (legacy production-cutover.lock may symlink here during install)
WOODRIGHT_MUTATION_LOCK_PATH=/srv/woodright/locks/production/live-cutover.lock

WOODRIGHT_ALLOW_HOST_PUBLISH=1
WOODRIGHT_ALLOWED_HOST_BIND_PREFIX=127.0.0.1:
WOODRIGHT_MONITOR_IDENTITY_KEY=production
