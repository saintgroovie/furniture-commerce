# Woodright runtime environment profile: STAGING (private / unprovisioned on demo VM)
# Explicit CLI: --environment staging
#
# CRITICAL: staging is NOT an alias for public_demo.
# Historical container names woodright-staging-* belong to public_demo only.
# On the current demo host this environment is UNPROVISIONED: mutators must fail
# closed before lock/Docker/metadata writes.
#
# Tracked in Git. No secrets.

WOODRIGHT_ENVIRONMENT=staging
WOODRIGHT_ENVIRONMENT_CLASS=STAGING_PRIVATE
WOODRIGHT_ENVIRONMENT_PROVISIONED=0
WOODRIGHT_PUBLIC_EXPOSURE=private
WOODRIGHT_PRODUCTION_DATA=0

# Intentionally do NOT point at woodright-stack-3dsdhd / woodright-demo.ru.
WOODRIGHT_DOKPLOY_COMPOSE_DIR=/srv/woodright/unprovisioned/staging/compose
WOODRIGHT_COMPOSE_ENV_FILE=/srv/woodright/unprovisioned/staging/compose/.env
WOODRIGHT_COMPOSE_FILE=/srv/woodright/unprovisioned/staging/compose/docker-compose.yml
WOODRIGHT_COMPOSE_PROJECT=woodright-staging-private
WOODRIGHT_COMPOSE_PROJECT_ALT=
WOODRIGHT_REQUIRE_COMPOSE_LABEL=1

# Prefixes that must NEVER match public_demo containers
WOODRIGHT_BE_NAME_PREFIX=woodright-staging-private-
WOODRIGHT_SF_NAME_PREFIX=woodright-staging-private-
WOODRIGHT_BE_CONTAINER_DEFAULT=woodright-staging-private-backend
WOODRIGHT_SF_CONTAINER_DEFAULT=woodright-staging-private-storefront
WOODRIGHT_REQUIRED_OWNER_LABEL=Dokploy
WOODRIGHT_REQUIRED_RUNTIME_ROLE=staging
WOODRIGHT_REQUIRED_EXPOSURE=private
WOODRIGHT_REQUIRED_DB_ALIAS=staging_db
WOODRIGHT_REQUIRED_BE_TITLE=woodright-backend
WOODRIGHT_REQUIRED_SF_TITLE=woodright-storefront

WOODRIGHT_NET_STACK=woodright-staging-private_net
WOODRIGHT_NET_DOKPLOY=dokploy-network
WOODRIGHT_MEDIA_VOLUME=woodright-staging-private_media
WOODRIGHT_MEDIA_MOUNT_IN_BE=/server/static
WOODRIGHT_DB_NAME=woodright_staging_private
WOODRIGHT_PG_CONTAINER_PREFIX=woodright-staging-private-postgres

WOODRIGHT_BUYER_HOST=http://127.0.0.1:3302
WOODRIGHT_API_HOST=http://127.0.0.1:9300
WOODRIGHT_CANONICAL_DOMAIN=
WOODRIGHT_FORBIDDEN_DOMAINS=woodright.ru,www.woodright.ru,woodright-demo.ru,api.woodright-demo.ru

WOODRIGHT_OWNERSHIP_DIR=/srv/woodright/runtime-ownership-staging
WOODRIGHT_ACTIVE_OWNER=/srv/woodright/runtime-ownership-staging/ACTIVE_OWNER.json
WOODRIGHT_EXPECTED_RELEASE=/srv/woodright/runtime-ownership-staging/EXPECTED_RELEASE.json
WOODRIGHT_ACTIVE_RELEASE=/srv/woodright/runtime-ownership-staging/ACTIVE_RELEASE.json
WOODRIGHT_IDENTITY_DIR=/srv/woodright/runtime-identity-staging
WOODRIGHT_ACTIVE_PUBLIC=/srv/woodright/runtime-identity-staging/ACTIVE_PUBLIC.json
WOODRIGHT_PUBLIC_DEMO_FILE=
WOODRIGHT_EVIDENCE_ROOT=/srv/woodright/reports/staging
WOODRIGHT_MUTATION_LOCK_PATH=/srv/woodright/locks/staging/live-cutover.lock

WOODRIGHT_ALLOW_HOST_PUBLISH=1
WOODRIGHT_ALLOWED_HOST_BIND_PREFIX=127.0.0.1:
WOODRIGHT_MONITOR_IDENTITY_KEY=staging
