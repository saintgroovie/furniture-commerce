# Woodright runtime environment profile: PUBLIC_PRODUCTION (future public site)
# Tracked in Git. No secrets. Loaded only via woodright-environment-profile.sh
# after explicit --environment public_production (CLI authority).
#
# This is NOT production_candidate / private_noindex and NOT public_demo.
# Technical stack may be provisioned (isolated DB/media/loopback) while buyer
# DNS/traffic cutover remains owner-gated. Launch gates below stay required.
# Name substring must NEVER auto-select this profile.

WOODRIGHT_ENVIRONMENT=public_production
WOODRIGHT_ENVIRONMENT_CLASS=PUBLIC_PRODUCTION
# 1 = technical stack provisioned on operator host (PROVISIONED_NOT_PUBLIC).
# Does NOT mean public launch or DNS cutover.
WOODRIGHT_ENVIRONMENT_PROVISIONED=1
WOODRIGHT_PUBLIC_EXPOSURE=public
WOODRIGHT_PRODUCTION_DATA=1

# Dokploy / compose identity (provisioned by technical prelaunch cycle; still no buyer DNS)
WOODRIGHT_DOKPLOY_COMPOSE_DIR=/etc/dokploy/compose/woodright-public-production
WOODRIGHT_COMPOSE_ENV_FILE=/etc/dokploy/compose/woodright-public-production/code/.env
WOODRIGHT_COMPOSE_FILE=/etc/dokploy/compose/woodright-public-production/code/docker-compose.yml
WOODRIGHT_COMPOSE_PROJECT=woodright-public-production
WOODRIGHT_COMPOSE_PROJECT_ALT=
WOODRIGHT_REQUIRE_COMPOSE_LABEL=1

# Container identity (distinct from staging-* demo and woodright-production-*)
WOODRIGHT_BE_NAME_PREFIX=woodright-public-production-
WOODRIGHT_SF_NAME_PREFIX=woodright-public-production-
WOODRIGHT_BE_CONTAINER_DEFAULT=woodright-public-production-backend
WOODRIGHT_SF_CONTAINER_DEFAULT=woodright-public-production-storefront
WOODRIGHT_REQUIRED_OWNER_LABEL=Dokploy
WOODRIGHT_REQUIRED_RUNTIME_ROLE=public_production
WOODRIGHT_REQUIRED_EXPOSURE=public
WOODRIGHT_REQUIRED_DB_ALIAS=public_production_db
WOODRIGHT_REQUIRED_BE_TITLE=woodright-backend
WOODRIGHT_REQUIRED_SF_TITLE=woodright-storefront

# Networks / media / DB identity (names only; not shared with demo/candidate)
WOODRIGHT_NET_STACK=woodright-public-production_woodright_public
WOODRIGHT_NET_DOKPLOY=dokploy-network
WOODRIGHT_MEDIA_VOLUME=woodright-public-production_woodright_public_media
WOODRIGHT_MEDIA_MOUNT_IN_BE=/server/static
WOODRIGHT_DB_NAME=woodright_public_production
# Role from ops/backup/woodright-public-production-restore-rehearsal.sh (POSTGRES_USER).
WOODRIGHT_DB_USER=woodright
WOODRIGHT_PG_CONTAINER_PREFIX=woodright-public-production-postgres
WOODRIGHT_REDIS_CONTAINER_DEFAULT=woodright-public-production-redis

# Public domains (apex canonical; www is redirect alias only)
WOODRIGHT_BUYER_HOST=https://woodright.ru
WOODRIGHT_API_HOST=https://api.woodright.ru
WOODRIGHT_CANONICAL_DOMAIN=woodright.ru
WOODRIGHT_WWW_HOST=www.woodright.ru
WOODRIGHT_FORBIDDEN_DOMAINS=woodright-demo.ru,www.woodright-demo.ru,api.woodright-demo.ru,127.0.0.1,localhost

# Launch / SEO / legal / payment / notification contracts (no secret values)
WOODRIGHT_LAUNCH_MODE=public_indexable
WOODRIGHT_SEO_MODE=public_indexable
WOODRIGHT_CANONICAL_SITE_URL=https://woodright.ru
WOODRIGHT_PUBLIC_API_URL=https://api.woodright.ru
WOODRIGHT_ADMIN_EXPOSURE=private
WOODRIGHT_PAYMENT_MODE=manual_invoice
# Owner 2026-09-03: OWNER_LEGAL_CONTENT_APPROVED (published caf82b0 pack).
# Fail-closed pack acceptance, not a new OD-01…05. Not DNS / pair / app SHA.
WOODRIGHT_LEGAL_CONTENT_STATUS=approved
WOODRIGHT_LEGAL_PACK_TOKEN=OWNER_LEGAL_CONTENT_APPROVED
# Owner 2026-09-03: OWNER APPROVE NOTIFICATION MODEL ADMIN_POLLING_ONLY.
# No email/SMS vendor. No buyer outbound notify path. Admin polling only.
WOODRIGHT_NOTIFICATION_MODE=admin_polling
# OD-05 = A already recorded (OWNER_DECISION_OD05_A_MANUAL_INVOICE_PAYMENT_LINK).
# This is metadata reconciliation, not a new owner payment decision.
WOODRIGHT_PAYMENT_DECISION_STATUS=accepted_manual
WOODRIGHT_NOTIFICATION_DECISION_STATUS=accepted

# Ownership + identity + evidence (environment-scoped; NEVER share with demo/candidate)
WOODRIGHT_OWNERSHIP_DIR=/srv/woodright/runtime-ownership-public-production
WOODRIGHT_ACTIVE_OWNER=/srv/woodright/runtime-ownership-public-production/ACTIVE_OWNER.json
WOODRIGHT_EXPECTED_RELEASE=/srv/woodright/runtime-ownership-public-production/EXPECTED_RELEASE.json
WOODRIGHT_ACTIVE_RELEASE=/srv/woodright/runtime-ownership-public-production/ACTIVE_RELEASE.json
WOODRIGHT_IDENTITY_DIR=/srv/woodright/runtime-identity-public-production
WOODRIGHT_ACTIVE_PUBLIC=/srv/woodright/runtime-identity-public-production/ACTIVE_PUBLIC.json
WOODRIGHT_PUBLIC_DEMO_FILE=
WOODRIGHT_EVIDENCE_ROOT=/srv/woodright/reports/public_production
WOODRIGHT_MUTATION_LOCK_PATH=/srv/woodright/locks/public_production/live-cutover.lock
WOODRIGHT_BACKUP_ROOT=/srv/woodright/backups/automated/public-production
WOODRIGHT_MONITOR_STATE_ROOT=/srv/woodright/monitoring/public-production/state
WOODRIGHT_MONITOR_HISTORY_ROOT=/srv/woodright/monitoring/public-production/history
WOODRIGHT_ALERT_DESTINATION_PATH=/srv/woodright/monitoring/public-production/alert-destination.json
WOODRIGHT_RESTORE_REPORT_DIR=/srv/woodright/reports/public_production/restore-rehearsal
WOODRIGHT_RECOVERY_MANIFEST_GLOB=/srv/woodright/backups/automated/public-production/manifests/recovery-point-*.json
WOODRIGHT_OWNER_APPROVAL_ENVIRONMENT=public_production
# Alert destination is required for launch readiness; file is provisioned on VM later.
WOODRIGHT_ALERT_DESTINATION_REQUIRED=1
# Backup/monitor contracts exist in repository; runtime install on operator host.
WOODRIGHT_MONITOR_BACKUP_CONTRACT=repository_ready
WOODRIGHT_MONITOR_BACKUP_RUNTIME_PROVISIONED=1

# CORS / cookie contract (origins only; no credentials)
WOODRIGHT_CORS_STORE_ORIGINS=https://woodright.ru,https://www.woodright.ru
WOODRIGHT_CORS_AUTH_ORIGINS=https://woodright.ru,https://www.woodright.ru
WOODRIGHT_COOKIE_SECURE=1
WOODRIGHT_COOKIE_SAMESITE=lax

# Host-publish: governed loopback verification binds (127.0.0.1:3300/9300).
# Not public exposure. Traefik buyer routing is a separate overlay.
WOODRIGHT_HOST_PUBLISH_POLICY=loopback_allowlist
WOODRIGHT_ALLOWED_HOST_BINDINGS=storefront:3002/tcp=127.0.0.1:3300,backend:9000/tcp=127.0.0.1:9300
WOODRIGHT_ALLOW_HOST_PUBLISH=0
WOODRIGHT_ALLOWED_HOST_BIND_PREFIX=

# Isolated pair-cutover HTTP probes. MUST stay loopback. Never use
# WOODRIGHT_BUYER_HOST / WOODRIGHT_API_HOST (apex URLs) as health targets.
WOODRIGHT_CUTOVER_STOREFRONT_PROBE_URL=http://127.0.0.1:3300
WOODRIGHT_CUTOVER_BACKEND_PROBE_URL=http://127.0.0.1:9300

# Monitor identity key
WOODRIGHT_MONITOR_IDENTITY_KEY=public_production

# Fail-closed launch gates (machine-readable; do not imply launch_ready)
WOODRIGHT_LAUNCH_GATE_OWNER_APPROVAL=required
WOODRIGHT_LAUNCH_GATE_LEGAL=required
WOODRIGHT_LAUNCH_GATE_PAYMENT_DECISION=required
WOODRIGHT_LAUNCH_GATE_NOTIFICATION_DECISION=required
WOODRIGHT_LAUNCH_GATE_MONITOR_BACKUP=required
WOODRIGHT_LAUNCH_GATE_DNS_TLS=required
