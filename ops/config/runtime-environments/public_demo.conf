# Woodright runtime environment profile: PUBLIC_DEMO (buyer-facing demo)
# Tracked in Git. No secrets. Loaded only via woodright-environment-profile.sh
# after explicit --environment public_demo (CLI authority).
#
# Historical container names contain "staging" but environment id is public_demo.
# Name substring must NEVER auto-select this profile.

WOODRIGHT_ENVIRONMENT=public_demo
WOODRIGHT_ENVIRONMENT_CLASS=PUBLIC_DEMO
WOODRIGHT_ENVIRONMENT_PROVISIONED=1
WOODRIGHT_PUBLIC_EXPOSURE=public
WOODRIGHT_PRODUCTION_DATA=0

# Dokploy / compose pins (UUIDs absent on VM labels; pin compose identity)
WOODRIGHT_DOKPLOY_COMPOSE_DIR=/etc/dokploy/compose/woodright-stack-3dsdhd
WOODRIGHT_COMPOSE_ENV_FILE=/etc/dokploy/compose/woodright-stack-3dsdhd/code/.env
WOODRIGHT_COMPOSE_FILE=/etc/dokploy/compose/woodright-stack-3dsdhd/code/docker-compose.staging.yml
WOODRIGHT_COMPOSE_PROJECT=woodright-stack-3dsdhd
WOODRIGHT_COMPOSE_PROJECT_ALT=
# App containers historically lack compose.project label; pin via name/role/volume.
WOODRIGHT_REQUIRE_COMPOSE_LABEL=0

# Container identity (legacy names; registry authority, not name substring)
WOODRIGHT_BE_NAME_PREFIX=woodright-staging-
WOODRIGHT_SF_NAME_PREFIX=woodright-staging-
WOODRIGHT_BE_CONTAINER_DEFAULT=woodright-staging-backend
WOODRIGHT_SF_CONTAINER_DEFAULT=woodright-staging-storefront
WOODRIGHT_REQUIRED_OWNER_LABEL=Dokploy
WOODRIGHT_REQUIRED_RUNTIME_ROLE=public_demo
WOODRIGHT_REQUIRED_EXPOSURE=public
WOODRIGHT_REQUIRED_DB_ALIAS=public_demo_db
WOODRIGHT_REQUIRED_BE_TITLE=woodright-backend
WOODRIGHT_REQUIRED_SF_TITLE=woodright-storefront

# Networks / media / DB identity (names only)
WOODRIGHT_NET_STACK=woodright-stack-3dsdhd_woodright_staging
WOODRIGHT_NET_DOKPLOY=dokploy-network
WOODRIGHT_MEDIA_VOLUME=woodright-stack-3dsdhd_woodright_staging_media
WOODRIGHT_MEDIA_MOUNT_IN_BE=/server/static
WOODRIGHT_DB_NAME=woodright_staging
WOODRIGHT_PG_CONTAINER_PREFIX=woodright-stack-3dsdhd-postgres

# Domains
WOODRIGHT_BUYER_HOST=https://woodright-demo.ru
WOODRIGHT_API_HOST=https://api.woodright-demo.ru
WOODRIGHT_CANONICAL_DOMAIN=woodright-demo.ru
WOODRIGHT_FORBIDDEN_DOMAINS=woodright.ru,www.woodright.ru

# Ownership + identity + evidence (environment-scoped; NOT shared with staging/production)
WOODRIGHT_OWNERSHIP_DIR=/srv/woodright/runtime-ownership-public-demo
WOODRIGHT_ACTIVE_OWNER=/srv/woodright/runtime-ownership-public-demo/ACTIVE_OWNER.json
WOODRIGHT_EXPECTED_RELEASE=/srv/woodright/runtime-ownership-public-demo/EXPECTED_RELEASE.json
WOODRIGHT_ACTIVE_RELEASE=/srv/woodright/runtime-ownership-public-demo/ACTIVE_RELEASE.json
WOODRIGHT_IDENTITY_DIR=/srv/woodright/runtime-identity-public-demo
WOODRIGHT_ACTIVE_PUBLIC=/srv/woodright/runtime-identity-public-demo/ACTIVE_PUBLIC.json
WOODRIGHT_PUBLIC_DEMO_FILE=/srv/woodright/runtime-identity-public-demo/public-demo.json
WOODRIGHT_EVIDENCE_ROOT=/srv/woodright/reports/public_demo
WOODRIGHT_MUTATION_LOCK_PATH=/srv/woodright/locks/public_demo/live-cutover.lock

# Port policy: app containers must not publish host ports post-promote
WOODRIGHT_ALLOW_HOST_PUBLISH=0

# Monitor identity key
WOODRIGHT_MONITOR_IDENTITY_KEY=public_demo
