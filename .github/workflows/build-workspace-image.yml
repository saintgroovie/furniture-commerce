      - name: Preserve compiler dependencies separately from runtime releases
        if: ${{ success() && inputs.artifact_kind == 'compiler-deps' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: workspace-compiler-deps-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ws-deps-${{ github.run_id }}-${{ github.run_attempt }}/compiler-deps.oci.tar
            ${{ runner.temp }}/ws-deps-${{ github.run_id }}-${{ github.run_attempt }}/compiler-deps-manifest.json
            ${{ runner.temp }}/ws-deps-${{ github.run_id }}-${{ github.run_attempt }}/cleanup.json
            ${{ runner.temp }}/ws-deps-${{ github.run_id }}-${{ github.run_attempt }}/writer-limit.json
          if-no-files-found: error
          retention-days: 7
