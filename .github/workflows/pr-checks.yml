# PR checks for Woodright monorepo (storefront production gate + fidelity).
name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storefront:
    name: Storefront production gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (heuristic, no values)
        working-directory: .
        run: |
          set -euo pipefail
          # Scan the checked-out tree (not a rev-range — git grep needs trees).
          if git grep -nE '(BEGIN (RSA |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' -- \
            '*.ts' '*.tsx' '*.js' '*.cjs' '*.yml' '*.yaml' '*.md' '*.env' '*.env.*' 2>/dev/null; then
            echo "Potential secret material in tracked files" >&2
            exit 1
          fi
          echo "secret_scan=ok"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (Yarn 4)
        working-directory: .
        run: |
          corepack enable
          corepack prepare yarn@4.6.0 --activate
          yarn --version

      - name: Install
        run: yarn install --immutable

      - name: Production typecheck
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
        run: yarn typecheck

      - name: Full typecheck (includes QA boards)
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
        run: yarn typecheck:all

      - name: Lint
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
        run: yarn lint

      - name: Production build
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
          NEXT_PUBLIC_SITE_URL: https://woodright-demo.ru
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ""
        run: yarn build

      - name: Client artifact URL gate
        run: |
          set -euo pipefail
          ROOT=".next-build/static/chunks"
          test -d "$ROOT"
          if grep -R --fixed-strings -l '89.169.188.29:9000' "$ROOT" 2>/dev/null; then
            echo "client leak: public IP:9000" >&2
            exit 1
          fi
          if grep -R --fixed-strings -l 'http://backend:9000' "$ROOT" 2>/dev/null; then
            echo "client leak: docker hostname" >&2
            exit 1
          fi
          echo "client_artifact_gate=ok"

      - name: Fidelity tests
        run: yarn test:fidelity

  backend-fidelity:
    name: Backend fidelity tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack (Yarn 4)
        working-directory: .
        run: |
          corepack enable
          corepack prepare yarn@4.6.0 --activate
          yarn --version
      - name: Install
        run: yarn install --immutable
      - name: Run classification/cart/catalog fidelity
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find src -name '*.fidelity.test.ts' | sort)
          echo "found ${#FILES[@]} fidelity files"
          for f in "${FILES[@]}"; do
            yarn dlx tsx "$f"
          done

  release-governance:
    name: Release governance gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Manifest / deploy / owner / report fixtures
        run: |
          set -euo pipefail
          node scripts/release/build-identity.cjs --self-test
          node scripts/release/validate-release-manifest.cjs --fixture-dir scripts/release/fixtures
          node scripts/release/validate-build-manifest.cjs --fixture-dir scripts/release/fixtures/build
          node scripts/release/validate-deploy-inputs.cjs --fixture-dir scripts/release/fixtures/deploy
          node scripts/release/check-owner-state.cjs --fixture-dir scripts/release/fixtures/owner
          node scripts/release/check-active-release.cjs --fixture-dir scripts/release/fixtures/active
          node scripts/release/check-candidate-registry.cjs --fixture-dir scripts/release/fixtures/candidates
          node scripts/release/validate-report-status.cjs --fixture-dir scripts/release/fixtures/reports
          node scripts/release/check-governance-no-deploy.cjs .github/workflows
          # Gates S–AC: cutover lock / CAS / TX / active-after-public / recon / audit / drift / cleanup / DQ
          node scripts/release/check-global-lock-policy.cjs scripts/release
          node scripts/release/check-global-lock-policy.cjs --fixture-dir scripts/release/fixtures/lock
          node scripts/release/validate-compare-and-swap.cjs --fixture-dir scripts/release/fixtures/cas
          node scripts/release/validate-cutover-transaction.cjs --fixture-dir scripts/release/fixtures/tx
          node scripts/release/validate-active-after-public.cjs --fixture-dir scripts/release/fixtures/active-public
          node scripts/release/validate-reconciliation.cjs --fixture-dir scripts/release/fixtures/reconciliation
          node scripts/release/validate-cutover-audit-log.cjs --fixture-dir scripts/release/fixtures/audit
          node scripts/release/monitor-live-drift.cjs --fixture-dir scripts/release/fixtures/drift
          node scripts/release/validate-candidate-cleanup.cjs --fixture-dir scripts/release/fixtures/candidate-cleanup
          node scripts/release/validate-dq-packet-provenance.cjs --fixture-dir scripts/release/fixtures/dq
          node scripts/release/validate-aborted-release-dir.cjs --fixture-dir scripts/release/fixtures/aborted-dir
          node scripts/catalog/audit-catalog-data-quality.cjs --self-test-readonly
          node scripts/catalog/audit-catalog-data-quality.cjs \
            --fixture scripts/catalog/fixtures/sample-products.json \
            --out /tmp/woodright-catalog-audit-ci \
            --release-sha 0000000000000000000000000000000000000000
          echo "release_governance_gates=ok"
