name: Woodright desk persistence
on:
  pull_request:
    paths:
      - apps/backend/**
      - apps/workspace/**
      - ops/backup/**
      - .github/workflows/workspace-persistence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desk-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: workspace_it_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workspace_it_desk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare yarn@4.17.1 --activate
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-berry-backend-${{ runner.os }}-${{ runner.arch }}-4.17.1-${{ hashFiles('apps/backend/yarn.lock') }}
          restore-keys: |
            yarn-berry-backend-${{ runner.os }}-${{ runner.arch }}-4.17.1-
      - name: Install exact backend dependencies
        working-directory: .
        env:
          YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org
        run: node scripts/release/yarn-install-network-resilient.cjs --cwd apps/backend
      - name: Typecheck desk server contract
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --skipLibCheck --strict
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          src/lib/woodright-desk/commands.ts src/lib/woodright-desk/private-files.ts
          src/lib/woodright-desk/http.ts src/api/admin/woodright/desk/*/route.ts
          src/lib/woodright-desk/mango.ts src/api/hooks/woodright/mango/events/call/route.ts
          'src/api/admin/woodright/desk/attachments/[id]/content/route.ts'
          src/modules/crm/index.ts src/modules/crm/migrations/*.ts
          src/api/admin/leads/route.ts src/api/admin/bespoke-requests/route.ts
          src/api/admin/room-sets/route.ts src/api/admin/woodright/order-processes/route.ts
      - name: Real PostgreSQL concurrency and private file checks
        env:
          WOODRIGHT_DESK_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/workspace_it_desk
        run: node node_modules/tsx/dist/cli.mjs --test src/lib/woodright-desk/desk.integration.test.ts src/lib/woodright-desk/mango.fidelity.test.ts
      - name: Targeted production migration rehearsal on disposable PostgreSQL
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/workspace_it_desk
          WOODRIGHT_DESK_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/workspace_it_desk
          WOODRIGHT_DESK_FEATURES: "1"
          NODE_ENV: development
          MEDUSA_TELEMETRY_DISABLED: "1"
        run: |
          node node_modules/@medusajs/cli/cli.js build
          node --test scripts/desk-migration.test.cjs
      - name: Private document restore integrity
        working-directory: .
        run: python3 ops/backup/test-private-files.py
      - name: Actual Medusa migration loader
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/workspace_it_desk_http
          WOODRIGHT_DESK_FEATURES: "1"
          NODE_ENV: development
        run: |
          node --input-type=module - <<'JS'
          import pg from "pg";
          const adminUrl = new URL(process.env.DATABASE_URL);
          adminUrl.pathname = "/postgres";
          const client = new pg.Client({ connectionString: adminUrl.toString() });
          await client.connect();
          try { await client.query("create database workspace_it_desk_http"); }
          finally { await client.end(); }
          JS
          node node_modules/@medusajs/cli/cli.js db:migrate
