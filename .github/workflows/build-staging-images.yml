# Build and push Woodright images to GHCR (public_demo | production_candidate | public_production).
# Manual only — does not deploy to Dokploy or production.
# Build ≠ release. Digests are the only deploy identity.
#
# RCA (fixed 2026-07-31): this workflow used to bake NEXT_PUBLIC_SITE_URL from
# a single `environment: staging` secret (STAGING_NEXT_PUBLIC_SITE_URL =
# https://woodright-demo.ru) for EVERY build, with no `build_profile` input
# and no WOODRIGHT_LAUNCH_MODE bake at all - so apps/storefront/Dockerfile's
# launch-contract gate was silently skipped, and the resulting demo-host
# images were later (incorrectly) used as "production-candidate" images.
# `build_profile` is now a REQUIRED input with no default that could silently
# pick one, and the storefront build-args always come from
# ops/config/image-build-profiles/<profile>.conf via
# scripts/release/resolve-image-build-profile.cjs - never from a "site URL"
# secret. A post-build scripts/release/scan-storefront-contamination.cjs gate
# scans the actual compiled bytes before anything is pushed.
#
# Tag namespace (authoritative discovery, still NOT deploy identity) and
# unique tag format are PROFILE-SCOPED so a production_candidate build of a
# given SHA never collides with a public_demo build of the same SHA:
#   build_profile=public_demo:          woodright.tag.namespace=build-staging-images
#                                        tag=build-<full-sha>-run-<run_id>-attempt-<attempt>
#   build_profile=production_candidate: woodright.tag.namespace=build-production-candidate
#                                        tag=build-prod-cand-<full-sha>-run-<run_id>-attempt-<attempt>
# Mutable convenience alias only: mutable-sha-<full-sha>
# Bare :<sha> tags are intentionally NOT published (mutable SHA-like traps).
#
# Storefront NEXT_PUBLIC_* values are compile-time and profile-controlled.
# This workflow REQUIRES the storefront publishable-key secret so images are
# never published with an empty publishable key.
name: Build staging images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact commit SHA to build (immutable, required - no workflow-ref fallback)."
        required: true
        type: string
      build_profile:
        description: "Image build profile - controls every baked URL/label. NEVER guess; production_candidate != public_demo."
        required: true
        type: choice
        options:
          - public_demo
          - production_candidate
          - public_production
      publish_mutable_sha_alias:
        description: "Also push mutable-sha-<SHA> convenience alias (serialized)."
        required: false
        type: boolean
        default: true
      release_mode:
        description: "main keeps the default ancestry pair bake. isolated_storefront is an explicit fail-closed exception."
        required: true
        type: choice
        default: main
        options:
          - main
          - isolated_storefront
      qualification_run_id:
        description: "Completed qualification-only workflow execution for this exact source/policy; required by an explicit runtime build."
        required: false
        type: string
        default: ""
      qualification_only:
        description: "Run all three exact-source gates with trusted policy context; never log in to GHCR, build images or publish."
        required: false
        type: boolean
        default: false
      storefront_runtime_policy:
        description: "Explicit trusted runtime migration contract; empty retains the default runtime prohibition. Build only, never deployment authority."
        required: false
        type: string
        default: ""
      production_base_sha:
        description: "Required for isolated_storefront. Live storefront OCI revision the candidate must descend from."
        required: false
        type: string
        default: ""
      release_ref:
        description: "Required for isolated_storefront. Remote branch release/<name> whose tip is the candidate SHA."
        required: false
        type: string
        default: ""
      backend_digest:
        description: "Required for isolated_storefront. Existing immutable backend digest to reuse. No backend image is built."
        required: false
        type: string
        default: ""
      backend_revision:
        description: "Required for isolated_storefront. OCI revision of the reused backend digest."
        required: false
        type: string
        default: ""
      production_storefront_digest:
        description: "Required for isolated_storefront. Published storefront digest whose OCI revision is production_base_sha."
        required: false
        type: string
        default: ""

permissions:
  checks: read
  actions: read
  contents: read

concurrency:
  # Immutable unique tags never collide; serialize only mutable alias promotion.
  group: woodright-ghcr-mutable-alias
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/saintgroovie/woodright

jobs:
  build:
    if: ${{ !inputs.qualification_only }}
    permissions:
      contents: read
      checks: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    outputs:
      source_sha: ${{ steps.sha.outputs.sha }}
      build_profile: ${{ inputs.build_profile }}
      unique_tag: ${{ steps.meta.outputs.unique_tag }}
      backend_digest: ${{ inputs.release_mode == 'isolated_storefront' && inputs.backend_digest || steps.backend.outputs.digest }}
      storefront_digest: ${{ steps.storefront.outputs.digest }}
    steps:
      - name: Validate source_sha format
        id: sha
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
          RUNTIME_POLICY: ${{ inputs.storefront_runtime_policy }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${INPUT_SHA}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Invalid source_sha: must be a full 40-char hex commit SHA (got '${INPUT_SHA}')" >&2
            exit 1
          fi
          if [ -n "${RUNTIME_POLICY}" ] && [ "${RELEASE_MODE}" != "isolated_storefront" ]; then
            echo "runtime policy requires isolated_storefront" >&2
            exit 1
          fi
          echo "sha=${INPUT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Compute build execution identity (profile-scoped)
        id: meta
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          PROFILE: ${{ inputs.build_profile }}
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}"
          ATTEMPT="${GITHUB_RUN_ATTEMPT}"
          case "$PROFILE" in
            production_candidate)
              NAMESPACE="build-production-candidate"
              UNIQUE="build-prod-cand-${SHA}-run-${RUN_ID}-attempt-${ATTEMPT}"
              ;;
            public_demo)
              NAMESPACE="build-staging-images"
              UNIQUE="build-${SHA}-run-${RUN_ID}-attempt-${ATTEMPT}"
              ;;
            public_production)
              NAMESPACE="build-public-production"
              UNIQUE="build-public-prod-${SHA}-run-${RUN_ID}-attempt-${ATTEMPT}"
              ;;
            *)
              echo "Unknown build_profile: $PROFILE" >&2
              exit 1
              ;;
          esac
          echo "source_sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "attempt=${ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "unique_tag=${UNIQUE}" >> "${GITHUB_OUTPUT}"
          echo "namespace=${NAMESPACE}" >> "${GITHUB_OUTPUT}"
          echo "unique_tag=${UNIQUE} namespace=${NAMESPACE}"

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0

      - name: Verify checked-out HEAD matches requested source_sha
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$EXPECTED_SHA" ]; then
            echo "Checked-out HEAD ($ACTUAL) does not match requested source_sha ($EXPECTED_SHA)" >&2
            exit 1
          fi

      - name: Restrict SHA to trusted deployment ancestry
        if: ${{ inputs.release_mode != 'isolated_storefront' }}
        env:
          CANDIDATE_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main integrate/deploy-candidate-20260716 2>/dev/null || git fetch --no-tags origin main
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "origin/main missing after fetch" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "${CANDIDATE_SHA}"; then
            if ! git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main; then
              echo "Refusing SHA ${CANDIDATE_SHA}: not on origin/main ancestry" >&2
              exit 1
            fi
          fi
          TRUSTED_TIPS="origin/main"
          if git rev-parse --verify origin/integrate/deploy-candidate-20260716 >/dev/null 2>&1; then
            TRUSTED_TIPS="${TRUSTED_TIPS} origin/integrate/deploy-candidate-20260716"
          fi
          ok=0
          for tip in ${TRUSTED_TIPS}; do
            if git merge-base --is-ancestor "${CANDIDATE_SHA}" "${tip}"; then
              echo "SHA ${CANDIDATE_SHA} is ancestor of ${tip}"
              ok=1
              break
            fi
          done
          if [ "${ok}" -ne 1 ]; then
            echo "Refusing SHA ${CANDIDATE_SHA}: not on trusted tips:${TRUSTED_TIPS}" >&2
            exit 1
          fi

      - name: Validate isolated storefront bake
        if: ${{ inputs.release_mode == 'isolated_storefront' }}
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          SOURCE_SHA: ${{ steps.sha.outputs.sha }}
          PRODUCTION_BASE_SHA: ${{ inputs.production_base_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          BACKEND_REVISION: ${{ inputs.backend_revision }}
          PRODUCTION_STOREFRONT_DIGEST: ${{ inputs.production_storefront_digest }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "isolated_storefront must be dispatched from refs/heads/main" >&2
            exit 1
          fi
          printf '%s\n' "${RELEASE_REF}" | grep -Eq '^release/[A-Za-z0-9][A-Za-z0-9._/-]*$'
          printf '%s\n' "${RELEASE_REF}" | grep -q '\.\.' && { echo "release ref must not contain .." >&2; exit 1; }
          printf '%s\n' "${PRODUCTION_STOREFRONT_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          rm -rf trusted-governance
          git fetch --no-tags origin "refs/heads/${RELEASE_REF}:refs/remotes/origin/${RELEASE_REF}"
          git fetch --no-tags origin main

      - name: Load isolated bake gate from the workflow SHA
        if: ${{ inputs.release_mode == 'isolated_storefront' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted-governance
          fetch-depth: 0
          persist-credentials: false

      - name: Run trusted isolated bake gate
        if: ${{ inputs.release_mode == 'isolated_storefront' }}
        id: isolated
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          SOURCE_SHA: ${{ steps.sha.outputs.sha }}
          PRODUCTION_BASE_SHA: ${{ inputs.production_base_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          BACKEND_REVISION: ${{ inputs.backend_revision }}
          PRODUCTION_STOREFRONT_DIGEST: ${{ inputs.production_storefront_digest }}
          RUNTIME_POLICY: ${{ inputs.storefront_runtime_policy }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          TRUSTED_POLICY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f trusted-governance/scripts/release/validate-isolated-storefront-bake.cjs
          test "$(git -C trusted-governance rev-parse HEAD)" = "${TRUSTED_POLICY_SHA}"
          git -C trusted-governance diff --exit-code HEAD --
          EXTRA=()
          if [ -n "${RUNTIME_POLICY}" ]; then
            EXTRA=(--runtime-policy "${RUNTIME_POLICY}" --trusted-policy-sha "${TRUSTED_POLICY_SHA}" --source-checks-file "${GITHUB_WORKSPACE}/source-checks.json" --qualification-run-id "${QUALIFICATION_RUN_ID}" --fetch-source-checks)
          fi
          node trusted-governance/scripts/release/validate-isolated-storefront-bake.cjs \
            --release-mode "${RELEASE_MODE}" \
            --source-sha "${SOURCE_SHA}" \
            --production-base-sha "${PRODUCTION_BASE_SHA}" \
            --release-ref "${RELEASE_REF}" \
            --backend-digest "${BACKEND_DIGEST}" \
            --backend-revision "${BACKEND_REVISION}" \
            --repo "${GITHUB_WORKSPACE}" \
            --production-storefront-digest "${PRODUCTION_STOREFRONT_DIGEST}" \
            --evidence-output "${GITHUB_WORKSPACE}/isolated-bake-evidence.json" \
            "${EXTRA[@]}" \
            --github-output

      - name: Choose release script root
        id: scripts
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_MODE}" = "isolated_storefront" ]; then
            test -f trusted-governance/scripts/release/write-build-manifest.py
            echo "root=trusted-governance" >> "${GITHUB_OUTPUT}"
          else
            echo "root=." >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve image build profile (fail-closed)
        id: profile
        env:
          PROFILE: ${{ inputs.build_profile }}
        run: |
          set -euo pipefail
          node ${{ steps.scripts.outputs.root }}/scripts/release/resolve-image-build-profile.cjs \
            --profile "${PROFILE}" --validate --checksum --print-env >> "${GITHUB_OUTPUT}"

      - name: Echo non-secret resolved profile values
        run: |
          set -euo pipefail
          echo "build_profile=${{ inputs.build_profile }}"
          echo "profile_checksum=${{ steps.profile.outputs.WOODRIGHT_PROFILE_CHECKSUM }}"
          echo "NEXT_PUBLIC_SITE_URL=${{ steps.profile.outputs.NEXT_PUBLIC_SITE_URL }}"
          echo "NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ steps.profile.outputs.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}"
          echo "WOODRIGHT_LAUNCH_MODE=${{ steps.profile.outputs.WOODRIGHT_LAUNCH_MODE }}"
          echo "WOODRIGHT_PAYMENT_MODE=${{ steps.profile.outputs.WOODRIGHT_PAYMENT_MODE }}"
          echo "WOODRIGHT_RUNTIME_ROLE=${{ steps.profile.outputs.WOODRIGHT_RUNTIME_ROLE }}"
          echo "WOODRIGHT_RUNTIME_EXPOSURE=${{ steps.profile.outputs.WOODRIGHT_RUNTIME_EXPOSURE }}"
          echo "WOODRIGHT_DB_ALIAS=${{ steps.profile.outputs.WOODRIGHT_DB_ALIAS }}"

      - name: Validate required storefront build secrets
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # Site/API URLs come from the resolved profile file (never a secret) -
          # ONLY the storefront publishable key is still a required secret here.
          if [ -z "${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}" ]; then
            echo "Missing secret: STAGING_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY" >&2
            echo "Refusing to publish a non-deployable storefront image." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify reused backend digest
        if: ${{ inputs.release_mode == 'isolated_storefront' }}
        env:
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          BACKEND_REVISION: ${{ inputs.backend_revision }}
          PRODUCTION_STOREFRONT_DIGEST: ${{ inputs.production_storefront_digest }}
          PRODUCTION_BASE_SHA: ${{ inputs.production_base_sha }}
        run: |
          set -euo pipefail
          BE_REV="$(docker buildx imagetools inspect "${IMAGE_PREFIX}-backend@${BACKEND_DIGEST}" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')"
          if [ "${BE_REV}" != "${BACKEND_REVISION}" ]; then
            echo "reused backend digest revision ${BE_REV} != declared ${BACKEND_REVISION}" >&2
            exit 1
          fi
          OWNER="$(docker buildx imagetools inspect "${IMAGE_PREFIX}-backend@${BACKEND_DIGEST}" --format '{{index .Image.Config.Labels "com.woodright.deployment-owner"}}')"
          if [ "${OWNER}" != "Dokploy" ]; then
            echo "reused backend deployment-owner ${OWNER} != Dokploy" >&2
            exit 1
          fi
          SF_BASE_REV="$(docker buildx imagetools inspect "${IMAGE_PREFIX}-storefront@${PRODUCTION_STOREFRONT_DIGEST}" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')"
          if [ "${SF_BASE_REV}" != "${PRODUCTION_BASE_SHA}" ]; then
            echo "production storefront digest revision ${SF_BASE_REV} != declared base ${PRODUCTION_BASE_SHA}" >&2
            exit 1
          fi

      - name: Build and push backend (unique tag)
        id: backend
        if: ${{ inputs.release_mode != 'isolated_storefront' }}
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/saintgroovie/furniture-commerce
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
            org.opencontainers.image.version=${{ steps.meta.outputs.unique_tag }}
            org.opencontainers.image.title=woodright-backend
            woodright.tag.namespace=${{ steps.meta.outputs.namespace }}
            woodright.workflow.run_id=${{ github.run_id }}
            woodright.workflow.run_attempt=${{ github.run_attempt }}
            woodright.build.unique_tag=${{ steps.meta.outputs.unique_tag }}
            woodright.image.build_profile=${{ inputs.build_profile }}
            woodright.image.build_profile_checksum=${{ steps.profile.outputs.WOODRIGHT_PROFILE_CHECKSUM }}
            woodright.tag.authoritative=false
            com.woodright.deployment-owner=Dokploy
          build-args: |
            WOODRIGHT_BACKEND_SOURCE_SHA=${{ steps.sha.outputs.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.unique_tag }}

      - name: Build storefront image locally (single artifact; no push yet)
        id: storefront_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/storefront/Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: |
            woodright-storefront:gate-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ env.IMAGE_PREFIX }}-storefront:${{ steps.meta.outputs.unique_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/saintgroovie/furniture-commerce
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
            org.opencontainers.image.version=${{ steps.meta.outputs.unique_tag }}
            org.opencontainers.image.title=woodright-storefront
            woodright.tag.namespace=${{ steps.meta.outputs.namespace }}
            woodright.workflow.run_id=${{ github.run_id }}
            woodright.workflow.run_attempt=${{ github.run_attempt }}
            woodright.build.unique_tag=${{ steps.meta.outputs.unique_tag }}
            woodright.image.build_profile=${{ inputs.build_profile }}
            woodright.image.build_profile_checksum=${{ steps.profile.outputs.WOODRIGHT_PROFILE_CHECKSUM }}
            woodright.tag.authoritative=false
            com.woodright.deployment-owner=Dokploy
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ steps.profile.outputs.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            MEDUSA_BACKEND_URL=${{ steps.profile.outputs.MEDUSA_BACKEND_URL }}
            MEDUSA_BACKEND_INTERNAL_URL=${{ steps.profile.outputs.MEDUSA_BACKEND_INTERNAL_URL }}
            NEXT_PUBLIC_SITE_URL=${{ steps.profile.outputs.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.STAGING_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CATALOG_CARD_DERIVATIVES=1
            WOODRIGHT_LAUNCH_MODE=${{ steps.profile.outputs.WOODRIGHT_LAUNCH_MODE }}
            WOODRIGHT_PAYMENT_MODE=${{ steps.profile.outputs.WOODRIGHT_PAYMENT_MODE }}
            WOODRIGHT_IMAGE_BUILD_PROFILE=${{ inputs.build_profile }}
            WOODRIGHT_RUNTIME_ROLE=${{ steps.profile.outputs.WOODRIGHT_RUNTIME_ROLE }}
            WOODRIGHT_RUNTIME_EXPOSURE=${{ steps.profile.outputs.WOODRIGHT_RUNTIME_EXPOSURE }}
            WOODRIGHT_DB_ALIAS=${{ steps.profile.outputs.WOODRIGHT_DB_ALIAS }}
            WOODRIGHT_ADMIN_EXPOSURE=${{ steps.profile.outputs.WOODRIGHT_ADMIN_EXPOSURE }}
            WOODRIGHT_STOREFRONT_SOURCE_SHA=${{ steps.sha.outputs.sha }}

      - name: Contamination gate (extract from the SAME loaded image that will be pushed)
        env:
          PROFILE: ${{ inputs.build_profile }}
          LOCAL_TAG: woodright-storefront:gate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Extract runtime trees from the exact local image digest we are about to push.
          # Do NOT rebuild between scan and publish (Codex: unscanned rebuild risk).
          IMAGE_ID="$(docker image inspect "${LOCAL_TAG}" --format '{{.Id}}')"
          echo "scanning_image_id=${IMAGE_ID}"
          CID="$(docker create "${LOCAL_TAG}")"
          # Use `docker container rm` (not the two-token rm shorthand) so
          # check-governance-no-deploy does not treat this temporary extract
          # container as a live deploy mutation.
          cleanup() { docker container rm -f "${CID}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          mkdir -p /tmp/woodright-sf-gate/standalone /tmp/woodright-sf-gate/static
          # Runner copies standalone → /workspace and static → /workspace/apps/storefront/.next-build/static
          docker cp "${CID}:/workspace/." /tmp/woodright-sf-gate/standalone/
          docker cp "${CID}:/workspace/apps/storefront/.next-build/static/." /tmp/woodright-sf-gate/static/ || {
            echo "static tree missing from loaded image" >&2
            exit 1
          }
          test -f /tmp/woodright-sf-gate/standalone/apps/storefront/server.js \
            || test -f /tmp/woodright-sf-gate/standalone/server.js \
            || { echo "standalone server.js missing from loaded image" >&2; exit 1; }
          test -f /tmp/woodright-sf-gate/standalone/woodright-bake-evidence.json \
            || test -f /tmp/woodright-sf-gate/standalone/apps/storefront/woodright-bake-evidence.json \
            || { echo "woodright-bake-evidence.json missing from loaded image standalone tree" >&2; exit 1; }
          node ${{ steps.scripts.outputs.root }}/scripts/release/scan-storefront-contamination.cjs \
            --profile "${PROFILE}" \
            --path /tmp/woodright-sf-gate/standalone \
            --path /tmp/woodright-sf-gate/static

      - name: Push the already-built storefront image (no rebuild)
        id: storefront
        env:
          LOCAL_TAG: woodright-storefront:gate-${{ github.run_id }}-${{ github.run_attempt }}
          REMOTE_TAG: ${{ env.IMAGE_PREFIX }}-storefront:${{ steps.meta.outputs.unique_tag }}
        run: |
          set -euo pipefail
          docker push "${REMOTE_TAG}"
          DIGEST="$(docker buildx imagetools inspect "${REMOTE_TAG}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; m=json.load(sys.stdin); print(m.get("digest") or "")')"
          if [ -z "${DIGEST}" ]; then
            # Fallback: RepoDigest from local inspect after push
            DIGEST="$(docker image inspect "${REMOTE_TAG}" --format '{{index .RepoDigests 0}}' | awk -F@ '{print $2}')"
          fi
          case "${DIGEST}" in sha256:*) ;; *) echo "failed to resolve storefront digest after push: ${DIGEST}" >&2; exit 1 ;; esac
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pushed ${REMOTE_TAG} @ ${DIGEST}"
      - name: Promote mutable-sha alias (optional, non-authoritative)
        if: ${{ inputs.publish_mutable_sha_alias && inputs.release_mode != 'isolated_storefront' }}
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          BE_DIGEST: ${{ steps.backend.outputs.digest }}
          SF_DIGEST: ${{ steps.storefront.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}-backend:mutable-sha-${SHA}" \
            "${IMAGE_PREFIX}-backend@${BE_DIGEST}"
          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}-storefront:mutable-sha-${SHA}" \
            "${IMAGE_PREFIX}-storefront@${SF_DIGEST}"
          echo "Published mutable convenience aliases mutable-sha-${SHA} (NOT deploy identity)"

      - name: Promote storefront mutable-sha alias (isolated, non-authoritative)
        if: ${{ inputs.publish_mutable_sha_alias && inputs.release_mode == 'isolated_storefront' }}
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          SF_DIGEST: ${{ steps.storefront.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}-storefront:mutable-sha-${SHA}" \
            "${IMAGE_PREFIX}-storefront@${SF_DIGEST}"
          echo "Published storefront-only mutable alias mutable-sha-${SHA} (NOT deploy identity)"

      - name: SHA parity + write build manifest (release_authorized=false)
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_REF: ${{ inputs.release_ref }}
          ISOLATED_BACKEND_DIGEST: ${{ inputs.backend_digest }}
          BACKEND_REVISION: ${{ inputs.backend_revision }}
          PRODUCTION_BASE_SHA: ${{ inputs.production_base_sha }}
          PRODUCTION_STOREFRONT_DIGEST: ${{ inputs.production_storefront_digest }}
          MAIN_SHA: ${{ steps.isolated.outputs.main_sha }}
          STOREFRONT_RUNTIME_POLICY: ${{ inputs.storefront_runtime_policy }}
          ISOLATED_BAKE_EVIDENCE: ${{ github.workspace }}/isolated-bake-evidence.json
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          STOREFRONT_DIGEST: ${{ steps.storefront.outputs.digest }}
          SHA: ${{ steps.sha.outputs.sha }}
          UNIQUE: ${{ steps.meta.outputs.unique_tag }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          PUBLISH_MUTABLE_ALIAS: ${{ inputs.publish_mutable_sha_alias }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          PROFILE_CHECKSUM: ${{ steps.profile.outputs.WOODRIGHT_PROFILE_CHECKSUM }}
          BAKED_NEXT_PUBLIC_SITE_URL: ${{ steps.profile.outputs.NEXT_PUBLIC_SITE_URL }}
          BAKED_NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ steps.profile.outputs.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
          BAKED_WOODRIGHT_LAUNCH_MODE: ${{ steps.profile.outputs.WOODRIGHT_LAUNCH_MODE }}
          BAKED_WOODRIGHT_PAYMENT_MODE: ${{ steps.profile.outputs.WOODRIGHT_PAYMENT_MODE }}
          BAKED_WOODRIGHT_RUNTIME_ROLE: ${{ steps.profile.outputs.WOODRIGHT_RUNTIME_ROLE }}
          BAKED_WOODRIGHT_RUNTIME_EXPOSURE: ${{ steps.profile.outputs.WOODRIGHT_RUNTIME_EXPOSURE }}
          BAKED_WOODRIGHT_DB_ALIAS: ${{ steps.profile.outputs.WOODRIGHT_DB_ALIAS }}
          BAKED_WOODRIGHT_ADMIN_EXPOSURE: ${{ steps.profile.outputs.WOODRIGHT_ADMIN_EXPOSURE }}
        run: |
          set -euo pipefail
          RELEASE_MODE="${RELEASE_MODE:-main}"
          if [ "${RELEASE_MODE}" = "isolated_storefront" ]; then
            BACKEND_DIGEST="${ISOLATED_BACKEND_DIGEST}"
          fi
          if [ -z "${BACKEND_DIGEST}" ] || [ -z "${STOREFRONT_DIGEST}" ]; then
            echo "Missing digests — partial pair not releasable" >&2
            exit 1
          fi
          case "${BACKEND_DIGEST}" in sha256:*) ;; *) echo "backend digest must be sha256:…" >&2; exit 1 ;; esac
          case "${STOREFRONT_DIGEST}" in sha256:*) ;; *) echo "storefront digest must be sha256:…" >&2; exit 1 ;; esac
          if [ "${BACKEND_DIGEST}" = "${STOREFRONT_DIGEST}" ]; then
            echo "backend/storefront digests unexpectedly identical" >&2
            exit 1
          fi
          BE_REV=$(docker buildx imagetools inspect "${IMAGE_PREFIX}-backend@${BACKEND_DIGEST}" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')
          SF_REV=$(docker buildx imagetools inspect "${IMAGE_PREFIX}-storefront@${STOREFRONT_DIGEST}" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')
          if [ -z "${BE_REV}" ] || [ -z "${SF_REV}" ]; then
            echo "OCI revision labels missing (fail-closed)" >&2
            exit 1
          fi
          if [ "${RELEASE_MODE}" = "isolated_storefront" ]; then
            if [ "${SF_REV}" != "${SHA}" ] || [ "${BE_REV}" != "${BACKEND_REVISION}" ] || [ "${BE_REV}" = "${SHA}" ]; then
              echo "isolated OCI mismatch SF=${SF_REV} expected_sf=${SHA} BE=${BE_REV} expected_be=${BACKEND_REVISION}" >&2
              exit 1
            fi
          elif [ "${BE_REV}" != "${SHA}" ] || [ "${SF_REV}" != "${SHA}" ]; then
            echo "OCI revision mismatch BE=${BE_REV} SF=${SF_REV} expected=${SHA}" >&2
            exit 1
          fi
          BE_OWNER=$(docker buildx imagetools inspect "${IMAGE_PREFIX}-backend@${BACKEND_DIGEST}" --format '{{index .Image.Config.Labels "com.woodright.deployment-owner"}}')
          SF_OWNER=$(docker buildx imagetools inspect "${IMAGE_PREFIX}-storefront@${STOREFRONT_DIGEST}" --format '{{index .Image.Config.Labels "com.woodright.deployment-owner"}}')
          if [ "${BE_OWNER}" != "Dokploy" ] || [ "${SF_OWNER}" != "Dokploy" ]; then
            echo "deployment-owner label missing/wrong BE=${BE_OWNER} SF=${SF_OWNER} expected=Dokploy" >&2
            exit 1
          fi
          BE_PROFILE=$(docker buildx imagetools inspect "${IMAGE_PREFIX}-backend@${BACKEND_DIGEST}" --format '{{index .Image.Config.Labels "woodright.image.build_profile"}}')
          SF_PROFILE=$(docker buildx imagetools inspect "${IMAGE_PREFIX}-storefront@${STOREFRONT_DIGEST}" --format '{{index .Image.Config.Labels "woodright.image.build_profile"}}')
          if [ "${SF_PROFILE}" != "${BUILD_PROFILE}" ]; then
            echo "storefront build_profile label mismatch SF=${SF_PROFILE} expected=${BUILD_PROFILE}" >&2
            exit 1
          fi
          if [ "${RELEASE_MODE}" != "isolated_storefront" ] && [ "${BE_PROFILE}" != "${BUILD_PROFILE}" ]; then
            echo "backend build_profile label mismatch BE=${BE_PROFILE} expected=${BUILD_PROFILE}" >&2
            exit 1
          fi
          image_env_value() {
            local image_ref="$1"
            local key="$2"
            docker buildx imagetools inspect "${image_ref}" --format '{{range .Image.Config.Env}}{{println .}}{{end}}' \
              | awk -F= -v key="${key}" '$1==key {print substr($0, length(key)+2); exit}'
          }
          SF_ENV_REV="$(image_env_value "${IMAGE_PREFIX}-storefront@${STOREFRONT_DIGEST}" WOODRIGHT_STOREFRONT_SOURCE_SHA)"
          if [ "${SF_ENV_REV}" != "${SF_REV}" ]; then
            echo "storefront baked WOODRIGHT_STOREFRONT_SOURCE_SHA=${SF_ENV_REV:-<absent>} != OCI revision ${SF_REV}" >&2
            exit 1
          fi
          BE_ENV_REV="$(image_env_value "${IMAGE_PREFIX}-backend@${BACKEND_DIGEST}" WOODRIGHT_BACKEND_SOURCE_SHA)"
          if [ "${RELEASE_MODE}" = "isolated_storefront" ]; then
            if [ -n "${BE_ENV_REV}" ] && [ "${BE_ENV_REV}" != "${BE_REV}" ]; then
              echo "reused backend baked WOODRIGHT_BACKEND_SOURCE_SHA=${BE_ENV_REV} != OCI revision ${BE_REV}" >&2
              exit 1
            fi
            if [ -z "${BE_ENV_REV}" ]; then
              echo "NOTE reused backend has no baked component revision; header stays absent until the next backend bake"
            fi
          elif [ "${BE_ENV_REV}" != "${BE_REV}" ]; then
            echo "backend baked WOODRIGHT_BACKEND_SOURCE_SHA=${BE_ENV_REV:-<absent>} != OCI revision ${BE_REV}" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          python3 ${{ steps.scripts.outputs.root }}/scripts/release/write-build-manifest.py
          node ${{ steps.scripts.outputs.root }}/scripts/release/validate-build-manifest.cjs release-artifacts/build-manifest.json
          python3 ${{ steps.scripts.outputs.root }}/scripts/release/write-release-manifest-partial.py || true
          echo "WARNING: mutable-sha aliases can drift — cutover MUST pin @digest; build is NOT release"

      - name: Upload build manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: woodright-build-manifest-${{ steps.meta.outputs.unique_tag }}
          path: |
            release-artifacts/build-manifest.json
            release-artifacts/release-manifest.partial.json
          if-no-files-found: error

  qualify-storefront:
    if: ${{ inputs.qualification_only }}
    name: Storefront production gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .runtime-policy
      - name: Verify exact source and qualification context
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          MODE: ${{ inputs.release_mode }}
          POLICY_ID: ${{ inputs.storefront_runtime_policy }}
          TRUSTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ inputs.production_base_sha }}
          BE_DIGEST: ${{ inputs.backend_digest }}
          BE_REVISION: ${{ inputs.backend_revision }}
          SF_BASE_DIGEST: ${{ inputs.production_storefront_digest }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${MODE}" = "isolated_storefront"
          test -n "${POLICY_ID}"
          printf '%s\n' "${RELEASE_REF}" | grep -Eq '^release/[A-Za-z0-9][A-Za-z0-9._/-]*$'
          ! printf '%s\n' "${RELEASE_REF}" | grep -q '\.\.'
          test "$(git -C .runtime-policy rev-parse HEAD)" = "${TRUSTED_SHA}"
          git -C .runtime-policy diff --exit-code HEAD --
          git -C . fetch --no-tags origin "refs/heads/${RELEASE_REF}:refs/remotes/origin/${RELEASE_REF}"
          node .runtime-policy/scripts/release/validate-isolated-storefront-bake.cjs \
            --qualification-only --qualification-job storefront \
            --release-mode isolated_storefront --runtime-policy "${POLICY_ID}" \
            --trusted-policy-sha "${TRUSTED_SHA}" --source-sha "${SOURCE_SHA}" \
            --production-base-sha "${BASE_SHA}" \
            --backend-digest "${BE_DIGEST}" --backend-revision "${BE_REVISION}" \
            --production-storefront-digest "${SF_BASE_DIGEST}" \
            --release-ref "${RELEASE_REF}" --repo "${GITHUB_WORKSPACE}/." \
            --evidence-output "${GITHUB_WORKSPACE}/qualification.json"
      - name: Use sealed trusted test context for the changed cache contract
        working-directory: .
        run: cp .runtime-policy/apps/storefront/src/lib/catalog-fetch-cache.fidelity.test.mjs apps/storefront/src/lib/catalog-fetch-cache.fidelity.test.mjs

      - name: Secret scan (heuristic, no values)
        working-directory: .
        run: |
          set -euo pipefail
          # Scan the checked-out tree (not a rev-range — git grep needs trees).
          if git grep -nE '(BEGIN (RSA |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' -- \
            '*.ts' '*.tsx' '*.js' '*.cjs' '*.yml' '*.yaml' '*.md' '*.env' '*.env.*' 2>/dev/null; then
            echo "Potential secret material in tracked files" >&2
            exit 1
          fi
          echo "secret_scan=ok"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (Yarn 4)
        working-directory: .
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          yarn --version
          test "$(yarn --version)" = "4.17.1"

      - name: Install
        run: yarn install --immutable

      - name: Production typecheck
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
        run: yarn typecheck

      - name: Full typecheck (includes QA boards)
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
        run: yarn typecheck:all

      - name: Lint
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
        run: yarn lint

      - name: Production build
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
          NEXT_PUBLIC_SITE_URL: https://woodright-demo.ru
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ""
        run: yarn build

      - name: Client artifact URL gate
        run: |
          set -euo pipefail
          ROOT=".next-build/static/chunks"
          test -d "$ROOT"
          if grep -R --fixed-strings -l '89.169.188.29:9000' "$ROOT" 2>/dev/null; then
            echo "client leak: public IP:9000" >&2
            exit 1
          fi
          if grep -R --fixed-strings -l 'http://backend:9000' "$ROOT" 2>/dev/null; then
            echo "client leak: docker hostname" >&2
            exit 1
          fi
          echo "client_artifact_gate=ok"

      - name: Public-demo actual artifact contamination gate
        working-directory: .
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
          NEXT_PUBLIC_SITE_URL: https://woodright-demo.ru
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.woodright-demo.ru
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_ci_placeholder
          WOODRIGHT_LAUNCH_MODE: private_noindex
          WOODRIGHT_PAYMENT_MODE: manual_invoice
          WOODRIGHT_IMAGE_BUILD_PROFILE: public_demo
          WOODRIGHT_RUNTIME_ROLE: public_demo
          WOODRIGHT_RUNTIME_EXPOSURE: public
          WOODRIGHT_DB_ALIAS: public_demo_db
          WOODRIGHT_ADMIN_EXPOSURE: private
          NODE_ENV: production
        run: |
          set -euo pipefail
          # Rebuild with factual public_demo bake identity so the scan matches
          # build-staging-images contamination contract (not the generic CI build).
          (cd apps/storefront && yarn build)
          # Mirror Dockerfile bake-evidence write so required markers are present
          # in the scanned tree (same contract as image contamination gate).
          (cd apps/storefront && node -e 'const fs=require("fs"); const path=require("path"); const ev={woodright_image_build_profile:process.env.WOODRIGHT_IMAGE_BUILD_PROFILE||"",NEXT_PUBLIC_SITE_URL:process.env.NEXT_PUBLIC_SITE_URL||"",NEXT_PUBLIC_MEDUSA_BACKEND_URL:process.env.NEXT_PUBLIC_MEDUSA_BACKEND_URL||"",WOODRIGHT_LAUNCH_MODE:process.env.WOODRIGHT_LAUNCH_MODE||"",WOODRIGHT_PAYMENT_MODE:process.env.WOODRIGHT_PAYMENT_MODE||"",WOODRIGHT_RUNTIME_ROLE:process.env.WOODRIGHT_RUNTIME_ROLE||"",WOODRIGHT_DB_ALIAS:process.env.WOODRIGHT_DB_ALIAS||"",private_noindex:process.env.WOODRIGHT_LAUNCH_MODE||"",manual_invoice:process.env.WOODRIGHT_PAYMENT_MODE||""}; const body=JSON.stringify(ev,Object.keys(ev).sort(),2)+"\n"; for (const rel of [".next-build/standalone/woodright-bake-evidence.json",".next-build/static/woodright-bake-evidence.json"]) { fs.mkdirSync(path.dirname(rel),{recursive:true}); fs.writeFileSync(rel,body); console.log("wrote",rel);} ')
          STANDALONE="apps/storefront/.next-build/standalone"
          STATIC="apps/storefront/.next-build/static"
          test -d "$STANDALONE"
          test -d "$STATIC"
          node scripts/release/scan-public-demo-actual-artifact.cjs \
            --standalone "$STANDALONE" \
            --static "$STATIC"

      - name: Production-candidate actual artifact regression gate
        working-directory: .
        env:
          MEDUSA_BACKEND_INTERNAL_URL: http://backend:9000
          NEXT_PUBLIC_SITE_URL: https://woodright.ru
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.woodright.ru
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_ci_placeholder
          WOODRIGHT_LAUNCH_MODE: private_noindex
          WOODRIGHT_PAYMENT_MODE: manual_invoice
          WOODRIGHT_IMAGE_BUILD_PROFILE: production_candidate
          WOODRIGHT_RUNTIME_ROLE: production_candidate
          WOODRIGHT_RUNTIME_EXPOSURE: private
          WOODRIGHT_DB_ALIAS: non_public_candidate_db
          WOODRIGHT_ADMIN_EXPOSURE: private
          NODE_ENV: production
        run: |
          set -euo pipefail
          (cd apps/storefront && yarn build)
          (cd apps/storefront && node -e 'const fs=require("fs"); const path=require("path"); const ev={woodright_image_build_profile:process.env.WOODRIGHT_IMAGE_BUILD_PROFILE||"",NEXT_PUBLIC_SITE_URL:process.env.NEXT_PUBLIC_SITE_URL||"",NEXT_PUBLIC_MEDUSA_BACKEND_URL:process.env.NEXT_PUBLIC_MEDUSA_BACKEND_URL||"",WOODRIGHT_LAUNCH_MODE:process.env.WOODRIGHT_LAUNCH_MODE||"",WOODRIGHT_PAYMENT_MODE:process.env.WOODRIGHT_PAYMENT_MODE||"",WOODRIGHT_RUNTIME_ROLE:process.env.WOODRIGHT_RUNTIME_ROLE||"",WOODRIGHT_DB_ALIAS:process.env.WOODRIGHT_DB_ALIAS||"",private_noindex:process.env.WOODRIGHT_LAUNCH_MODE||"",manual_invoice:process.env.WOODRIGHT_PAYMENT_MODE||""}; const body=JSON.stringify(ev,Object.keys(ev).sort(),2)+"\n"; for (const rel of [".next-build/standalone/woodright-bake-evidence.json",".next-build/static/woodright-bake-evidence.json"]) { fs.mkdirSync(path.dirname(rel),{recursive:true}); fs.writeFileSync(rel,body); console.log("wrote",rel);} ')
          STANDALONE="apps/storefront/.next-build/standalone"
          STATIC="apps/storefront/.next-build/static"
          test -d "$STANDALONE"
          test -d "$STATIC"
          node scripts/release/scan-storefront-contamination.cjs \
            --profile production_candidate \
            --path "$STANDALONE" \
            --path "$STATIC"

      - name: Fidelity tests
        run: yarn test:fidelity

      # This tests the CI audit CLI, not buyer runtime source. The frozen app
      # intentionally predates this helper; keep it out of the app source tree.
      - name: Streamed schema audit regression tests
        working-directory: .runtime-policy/apps/storefront
        run: python3 scripts/test_catalog_schema_stream.py
      - name: Seal checked source after all gates
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          MODE: ${{ inputs.release_mode }}
          POLICY_ID: ${{ inputs.storefront_runtime_policy }}
          TRUSTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ inputs.production_base_sha }}
          BE_DIGEST: ${{ inputs.backend_digest }}
          BE_REVISION: ${{ inputs.backend_revision }}
          SF_BASE_DIGEST: ${{ inputs.production_storefront_digest }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${MODE}" = "isolated_storefront"
          test -n "${POLICY_ID}"
          printf '%s\n' "${RELEASE_REF}" | grep -Eq '^release/[A-Za-z0-9][A-Za-z0-9._/-]*$'
          ! printf '%s\n' "${RELEASE_REF}" | grep -q '\.\.'
          test "$(git -C .runtime-policy rev-parse HEAD)" = "${TRUSTED_SHA}"
          git -C .runtime-policy diff --exit-code HEAD --
          git -C . fetch --no-tags origin "refs/heads/${RELEASE_REF}:refs/remotes/origin/${RELEASE_REF}"
          node .runtime-policy/scripts/release/validate-isolated-storefront-bake.cjs \
            --qualification-only --post-checks --qualification-job storefront \
            --release-mode isolated_storefront --runtime-policy "${POLICY_ID}" \
            --trusted-policy-sha "${TRUSTED_SHA}" --source-sha "${SOURCE_SHA}" \
            --production-base-sha "${BASE_SHA}" \
            --backend-digest "${BE_DIGEST}" --backend-revision "${BE_REVISION}" \
            --production-storefront-digest "${SF_BASE_DIGEST}" \
            --release-ref "${RELEASE_REF}" --repo "${GITHUB_WORKSPACE}/." \
            --evidence-output "${GITHUB_WORKSPACE}/qualification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-qualification-${{ github.run_id }}-${{ github.run_attempt }}-storefront
          path: qualification.json
          if-no-files-found: error

  qualify-backend-fidelity:
    if: ${{ inputs.qualification_only }}
    name: Backend fidelity tests
    runs-on: ubuntu-latest
    # Raised from 30: install-level retry may sleep up to 600s cumulative on 429.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .runtime-policy
      - name: Verify exact source and qualification context
        id: reuse
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          MODE: ${{ inputs.release_mode }}
          POLICY_ID: ${{ inputs.storefront_runtime_policy }}
          TRUSTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ inputs.production_base_sha }}
          BE_DIGEST: ${{ inputs.backend_digest }}
          BE_REVISION: ${{ inputs.backend_revision }}
          SF_BASE_DIGEST: ${{ inputs.production_storefront_digest }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${MODE}" = "isolated_storefront"
          test -n "${POLICY_ID}"
          printf '%s\n' "${RELEASE_REF}" | grep -Eq '^release/[A-Za-z0-9][A-Za-z0-9._/-]*$'
          ! printf '%s\n' "${RELEASE_REF}" | grep -q '\.\.'
          test "$(git -C .runtime-policy rev-parse HEAD)" = "${TRUSTED_SHA}"
          git -C .runtime-policy diff --exit-code HEAD --
          git -C . fetch --no-tags origin "refs/heads/${RELEASE_REF}:refs/remotes/origin/${RELEASE_REF}"
          node .runtime-policy/scripts/release/validate-isolated-storefront-bake.cjs \
            --github-output --qualification-only --qualification-job backend-fidelity \
            --release-mode isolated_storefront --runtime-policy "${POLICY_ID}" \
            --trusted-policy-sha "${TRUSTED_SHA}" --source-sha "${SOURCE_SHA}" \
            --production-base-sha "${BASE_SHA}" \
            --backend-digest "${BE_DIGEST}" --backend-revision "${BE_REVISION}" \
            --production-storefront-digest "${SF_BASE_DIGEST}" \
            --release-ref "${RELEASE_REF}" --repo "${GITHUB_WORKSPACE}/." \
            --evidence-output "${GITHUB_WORKSPACE}/qualification.json"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack (Yarn 4)
        if: ${{ steps.reuse.outputs.reused_gates != 'true' }}
        working-directory: .
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          yarn --version
          test "$(yarn --version)" = "4.17.1"
      # Yarn Berry global cache (enableGlobalCache=true → ~/.yarn/berry/cache).
      # Explicit path avoids setup-node detecting Yarn 1 before Corepack activates Yarn 4.
      - name: Restore Yarn Berry cache
        if: ${{ steps.reuse.outputs.reused_gates != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-berry-backend-${{ runner.os }}-${{ runner.arch }}-4.17.1-${{ hashFiles('apps/backend/yarn.lock') }}
          restore-keys: |
            yarn-berry-backend-${{ runner.os }}-${{ runner.arch }}-4.17.1-
      # Prefer npmjs over Yarn's default registry CDN - Backend fidelity hit
      # sustained HTTP 429 during PR #167 recovery (attempts 1-3).
      # Install-level bounded retry for residual registry 429 after Yarn httpRetry.
      # Canonical command remains: yarn install --immutable
      - name: Install
        if: ${{ steps.reuse.outputs.reused_gates != 'true' }}
        working-directory: .
        env:
          YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org
        run: node scripts/release/yarn-install-network-resilient.cjs --cwd apps/backend
      - name: Run classification/cart/catalog fidelity
        if: ${{ steps.reuse.outputs.reused_gates != 'true' }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find src -name '*.fidelity.test.ts' | sort)
          echo "found ${#FILES[@]} fidelity files"
          for f in "${FILES[@]}"; do
            yarn dlx tsx "$f"
          done
      - name: Seal checked source after all gates
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          MODE: ${{ inputs.release_mode }}
          POLICY_ID: ${{ inputs.storefront_runtime_policy }}
          TRUSTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ inputs.production_base_sha }}
          BE_DIGEST: ${{ inputs.backend_digest }}
          BE_REVISION: ${{ inputs.backend_revision }}
          SF_BASE_DIGEST: ${{ inputs.production_storefront_digest }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${MODE}" = "isolated_storefront"
          test -n "${POLICY_ID}"
          printf '%s\n' "${RELEASE_REF}" | grep -Eq '^release/[A-Za-z0-9][A-Za-z0-9._/-]*$'
          ! printf '%s\n' "${RELEASE_REF}" | grep -q '\.\.'
          test "$(git -C .runtime-policy rev-parse HEAD)" = "${TRUSTED_SHA}"
          git -C .runtime-policy diff --exit-code HEAD --
          git -C . fetch --no-tags origin "refs/heads/${RELEASE_REF}:refs/remotes/origin/${RELEASE_REF}"
          node .runtime-policy/scripts/release/validate-isolated-storefront-bake.cjs \
            --qualification-only --post-checks --qualification-job backend-fidelity \
            --release-mode isolated_storefront --runtime-policy "${POLICY_ID}" \
            --trusted-policy-sha "${TRUSTED_SHA}" --source-sha "${SOURCE_SHA}" \
            --production-base-sha "${BASE_SHA}" \
            --backend-digest "${BE_DIGEST}" --backend-revision "${BE_REVISION}" \
            --production-storefront-digest "${SF_BASE_DIGEST}" \
            --release-ref "${RELEASE_REF}" --repo "${GITHUB_WORKSPACE}/." \
            --evidence-output "${GITHUB_WORKSPACE}/qualification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-qualification-${{ github.run_id }}-${{ github.run_attempt }}-backend-fidelity
          path: qualification.json
          if-no-files-found: error

  qualify-release-governance:
    if: ${{ inputs.qualification_only }}
    name: Release governance gates
    runs-on: ubuntu-latest
    # Raised from 10: the cutover execute-path shell harnesses spawn a few
    # thousand short-lived processes (fake docker/compose shims) and take a
    # couple of minutes on hosted runners.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: true
          path: .runtime-source
      - name: Verify exact source and qualification context
        id: reuse
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          MODE: ${{ inputs.release_mode }}
          POLICY_ID: ${{ inputs.storefront_runtime_policy }}
          TRUSTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ inputs.production_base_sha }}
          BE_DIGEST: ${{ inputs.backend_digest }}
          BE_REVISION: ${{ inputs.backend_revision }}
          SF_BASE_DIGEST: ${{ inputs.production_storefront_digest }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${MODE}" = "isolated_storefront"
          test -n "${POLICY_ID}"
          printf '%s\n' "${RELEASE_REF}" | grep -Eq '^release/[A-Za-z0-9][A-Za-z0-9._/-]*$'
          ! printf '%s\n' "${RELEASE_REF}" | grep -q '\.\.'
          test "$(git -C . rev-parse HEAD)" = "${TRUSTED_SHA}"
          git -C . diff --exit-code HEAD --
          git -C .runtime-source fetch --no-tags origin "refs/heads/${RELEASE_REF}:refs/remotes/origin/${RELEASE_REF}"
          node ./scripts/release/validate-isolated-storefront-bake.cjs \
            --github-output --qualification-only --qualification-job release-governance \
            --release-mode isolated_storefront --runtime-policy "${POLICY_ID}" \
            --trusted-policy-sha "${TRUSTED_SHA}" --source-sha "${SOURCE_SHA}" \
            --production-base-sha "${BASE_SHA}" \
            --backend-digest "${BE_DIGEST}" --backend-revision "${BE_REVISION}" \
            --production-storefront-digest "${SF_BASE_DIGEST}" \
            --release-ref "${RELEASE_REF}" --repo "${GITHUB_WORKSPACE}/.runtime-source" \
            --evidence-output "${GITHUB_WORKSPACE}/qualification.json"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Manifest / deploy / owner / report fixtures
        if: ${{ steps.reuse.outputs.reused_gates != 'true' }}
        run: |
          set -euo pipefail
          node scripts/release/build-identity.cjs --self-test
          node scripts/release/validate-release-manifest.cjs --fixture-dir scripts/release/fixtures
          node scripts/release/validate-build-manifest.cjs --fixture-dir scripts/release/fixtures/build
          node scripts/release/validate-deploy-inputs.cjs --fixture-dir scripts/release/fixtures/deploy
          node scripts/release/check-owner-state.cjs --fixture-dir scripts/release/fixtures/owner
          node scripts/release/check-active-release.cjs --fixture-dir scripts/release/fixtures/active
          node scripts/release/check-candidate-registry.cjs --fixture-dir scripts/release/fixtures/candidates
          node scripts/release/validate-report-status.cjs --fixture-dir scripts/release/fixtures/reports
          node scripts/release/check-governance-no-deploy.cjs .github/workflows
          node scripts/release/deployment-owner-label.fidelity.test.cjs
          node scripts/release/validate-isolated-storefront-bake.fidelity.test.cjs
          bash scripts/ops/test-runtime-discovery-fidelity.sh
          bash scripts/ops/test-media-gate-v2-fidelity.sh
          bash scripts/ops/test-public-demo-media-prepromote-fidelity.sh
          node scripts/release/backend-media-promotion.fidelity.test.cjs
          node scripts/release/staging-mutation-lock.fidelity.test.cjs
          node scripts/release/backend-network-alias.fidelity.test.cjs
          node scripts/release/public-image-pin-consistency.fidelity.test.cjs
          node scripts/release/public-image-pin-lock.fidelity.test.cjs
          # Production-candidate image bake + cutover helper (2026-07-31 RCA fix)
          node scripts/release/image-build-profile.fidelity.test.cjs
          node scripts/release/scan-storefront-contamination.fidelity.test.cjs
          node scripts/release/scan-public-demo-actual-artifact.fidelity.test.cjs
          node scripts/release/backend-ci-registry.fidelity.test.cjs
          node scripts/release/backend-ci-install-resilience.fidelity.test.cjs
          node scripts/release/yarn-install-network-resilient.fidelity.test.cjs
          node scripts/release/cutover-production-candidate.fidelity.test.cjs
          # Private production-candidate execute path: locking, atomic pin
          # writes, keeper-based recreate, health gates, rollback and traps.
          # Runs entirely against a /tmp fake filesystem + docker/compose shims.
          bash scripts/ops/test-production-candidate-cutover-execute-fidelity.sh
          bash scripts/ops/test-compose-env-privileged-fingerprint.sh
          bash scripts/ops/test-compose-env-privileged-pin-write.sh
          bash scripts/ops/test-compose-env-privileged-compose.sh
          node scripts/release/cutover-public-production-pair.fidelity.test.cjs
          node scripts/release/retained-peer-readiness.fidelity.test.cjs
          bash scripts/ops/test-public-production-pair-cutover-execute-fidelity.sh
          bash scripts/ops/test-public-production-protected-pin-write.sh
          bash scripts/ops/test-public-production-protected-pin-permissions.sh
          bash scripts/ops/test-digest-authority-schema-fidelity.sh
          bash scripts/ops/test-production-candidate-component-identity-rebind-fidelity.sh
          bash scripts/ops/test-production-candidate-compose-template-fidelity.sh
          bash scripts/ops/test-public-demo-pair-cutover-fidelity.sh
          bash scripts/ops/test-public-demo-edge-settle-fidelity.sh
          bash scripts/ops/test-public-demo-traefik-endpoint-fidelity.sh
          bash scripts/ops/test-public-demo-cutover-capability-hardening-fidelity.sh
          bash scripts/ops/test-public-demo-target-env-fidelity.sh
          bash scripts/ops/test-public-demo-scoped-ownership-converge-fidelity.sh
          bash scripts/ops/test-public-demo-legacy-active-cleanup-fidelity.sh
          bash scripts/ops/test-public-demo-metadata-authority-fidelity.sh
          bash scripts/ops/test-owner-approved-release-fidelity.sh
          bash scripts/ops/test-environment-governance-fidelity.sh
          bash scripts/ops/test-public-apex-routing-cutover-fidelity.sh
          bash scripts/ops/test-product-compatibility-migration.sh
          # Gates S–AC: cutover lock / CAS / TX / active-after-public / recon / audit / drift / cleanup / DQ
          node scripts/release/check-global-lock-policy.cjs scripts/release
          node scripts/release/check-global-lock-policy.cjs --fixture-dir scripts/release/fixtures/lock
          node scripts/release/validate-compare-and-swap.cjs --fixture-dir scripts/release/fixtures/cas
          node scripts/release/validate-cutover-transaction.cjs --fixture-dir scripts/release/fixtures/tx
          node scripts/release/validate-active-after-public.cjs --fixture-dir scripts/release/fixtures/active-public
          node scripts/release/validate-reconciliation.cjs --fixture-dir scripts/release/fixtures/reconciliation
          node scripts/release/validate-cutover-audit-log.cjs --fixture-dir scripts/release/fixtures/audit
          node scripts/release/monitor-live-drift.cjs --fixture-dir scripts/release/fixtures/drift
          node scripts/release/validate-candidate-cleanup.cjs --fixture-dir scripts/release/fixtures/candidate-cleanup
          node scripts/release/validate-dq-packet-provenance.cjs --fixture-dir scripts/release/fixtures/dq
          node scripts/release/validate-aborted-release-dir.cjs --fixture-dir scripts/release/fixtures/aborted-dir
          node scripts/catalog/audit-catalog-data-quality.cjs --self-test-readonly
          node scripts/catalog/audit-catalog-data-quality.cjs \
            --fixture scripts/catalog/fixtures/sample-products.json \
            --out /tmp/woodright-catalog-audit-ci \
            --release-sha 0000000000000000000000000000000000000000
          # Gates AD–AQ: split bundle / Dokploy / tools / DQ sources
          node scripts/release/validate-release-bundle-manifest.cjs --fixture-dir scripts/release/fixtures/bundle
          node scripts/release/validate-release-bundle-manifest.cjs --fixture-dir scripts/release/fixtures/rollback
          node scripts/release/validate-component-provenance.cjs --fixture-dir scripts/release/fixtures/provenance
          node scripts/release/validate-compatibility-contract.cjs --fixture-dir scripts/release/fixtures/compat
          node scripts/release/validate-active-release-bundle.cjs --fixture-dir scripts/release/fixtures/active-bundle
          # Production-mode path: flat ACTIVE_RELEASE + relative manifest_path (exact bytes checksum)
          node scripts/release/validate-active-release-bundle.cjs scripts/release/fixtures/active-bundle/pos-server-path.json
          if node scripts/release/validate-active-release-bundle.cjs scripts/release/fixtures/active-bundle/pos-valid.json; then
            echo "expected production mode to reject CI envelope" >&2
            exit 1
          fi
          node scripts/release/validate-dokploy-enforcement.cjs --fixture-dir scripts/release/fixtures/dokploy
          node scripts/release/validate-mutation-lease.cjs --fixture-dir scripts/release/fixtures/lease
          node scripts/release/validate-tools-runner-policy.cjs --fixture-dir scripts/release/fixtures/tools-runner
          node scripts/release/validate-dto-data-gap-distinction.cjs --fixture-dir scripts/release/fixtures/dto-gaps
          node scripts/release/validate-dq-packet-provenance.cjs --fixture-dir scripts/release/fixtures/dq-bundle
          node scripts/release/validate-metadata-migration.cjs --fixture-dir scripts/release/fixtures/metadata-migration
          node scripts/release/validate-component-cutover-state.cjs --fixture-dir scripts/release/fixtures/component-cutover
          # Gates AR–BC: Dokploy control-plane / stacks / owner-review / mutation dry-run
          node scripts/release/validate-dokploy-enforcement.cjs --fixture-dir scripts/release/fixtures/dokploy
          node scripts/release/validate-stack-registry.cjs --fixture-dir scripts/release/fixtures/stacks
          node scripts/release/validate-public-route-uniqueness.cjs --fixture-dir scripts/release/fixtures/routes
          node scripts/release/validate-owner-review-decisions.cjs --fixture-dir scripts/release/fixtures/owner-review
          node scripts/release/validate-catalog-mutation-manifest.cjs --fixture-dir scripts/release/fixtures/mutation-manifest
          node scripts/catalog/dry-run-catalog-mutations.cjs --fixture-dir scripts/release/fixtures/mutation-dryrun
          node scripts/release/validate-code-data-separation.cjs --fixture-dir scripts/release/fixtures/code-data
          node scripts/catalog/build-owner-review-packet.cjs \
            --endpoint-comparison scripts/catalog/fixtures/sample-endpoint-comparison.json \
            --inventory scripts/catalog/fixtures/sample-dq-inventory.json \
            --out /tmp/woodright-owner-review-ci
          node scripts/release/validate-owner-review-decisions.cjs /tmp/woodright-owner-review-ci/review-decisions.json
          node scripts/release/validate-stack-registry.cjs scripts/release/fixtures/stacks/pos-complete.json
          node scripts/release/validate-public-route-uniqueness.cjs scripts/release/fixtures/routes/pos-unique.json
          node scripts/catalog/assert-owner-review-identity-mismatch.cjs
          # Gates BD–BQ: live reconciliation / intents / identity
          node scripts/release/validate-intent-registry.cjs --fixture-dir scripts/release/fixtures/intent
          node scripts/release/validate-owner-txt-generation.cjs --fixture-dir scripts/release/fixtures/owner-txt
          node scripts/release/validate-external-cutover-reconciliation.cjs --fixture-dir scripts/release/fixtures/external-cutover
          node scripts/release/validate-product-identity-compare.cjs --fixture-dir scripts/release/fixtures/product-identity
          node scripts/release/validate-stack-mutation-attribution.cjs --fixture-dir scripts/release/fixtures/stack-attribution
          node scripts/release/validate-owner-decision-defaults.cjs --fixture-dir scripts/release/fixtures/owner-decision
          # Runtime identity / public evidence fail-closed
          node scripts/release/validate-runtime-identity.cjs --self-test
          node scripts/release/validate-runtime-identity.cjs --fixture-dir scripts/release/fixtures/runtime-identity
          node scripts/release/assert-public-deploy-target.cjs --self-test
          node scripts/release/verify-public-runtime-identity.cjs --offline \
            --url https://api.woodright-demo.ru/health \
            --headers-json '{"x-woodright-runtime-role":"public_demo","x-woodright-exposure":"public","x-woodright-release-sha":"f7f6760fca86ff503529da6696c04159e76ef9c8"}' \
            --expected-sha f7f6760fca86ff503529da6696c04159e76ef9c8
          if node scripts/release/verify-public-runtime-identity.cjs --url http://127.0.0.1:9200/health; then
            echo "expected public verifier to reject :9200" >&2
            exit 1
          fi
          if node scripts/release/verify-public-runtime-identity.cjs --url http://api.woodright-demo.ru/health; then
            echo "expected public verifier to reject http canonical URL" >&2
            exit 1
          fi
          if node scripts/release/verify-public-runtime-identity.cjs --offline \
            --url https://api.woodright-demo.ru/health \
            --final-url http://127.0.0.1:9200/health \
            --headers-json '{"x-woodright-runtime-role":"public_demo","x-woodright-exposure":"public","x-woodright-release-sha":"f7f6760fca86ff503529da6696c04159e76ef9c8"}' \
            --expected-sha f7f6760fca86ff503529da6696c04159e76ef9c8; then
            echo "expected public verifier to reject non-canonical final URL" >&2
            exit 1
          fi
          if node scripts/release/verify-public-runtime-identity.cjs --offline \
            --url https://api.woodright-demo.ru/health \
            --headers-json '{"x-woodright-runtime-role":"non_public_candidate","x-woodright-exposure":"private"}'; then
            echo "expected public verifier to reject private exposure" >&2
            exit 1
          fi
          node scripts/catalog/compare-catalog-sources.cjs \
            --list-fixture scripts/catalog/fixtures/sample-products.json \
            --auth-fixture scripts/catalog/fixtures/sample-catalog-products.json \
            --out /tmp/woodright-catalog-compare-ci \
            --bundle-id wrb-20260721T155624Z-be643a429-sf54d1802 \
            --backend-revision 643a429927adc934b89596df34dddb4a9d096cf6 \
            --storefront-revision 54d1802cae921ed10acfaee2f0b742e63b511232 \
            --backend-digest sha256:8fa5b643b222afda217733d2c652942b7b4fecb12d3d19aef143f55d86efdf17 \
            --storefront-digest sha256:f493381a466b94956e62ccc9c3617731e91fcbace54ae648bbdfbbd711f33347
          test -f scripts/release/run-server-governance-tool.sh
          bash -n scripts/release/run-server-governance-tool.sh
          # Gates BR–CE: owner decision workspace / disposable Dokploy / mutation preview
          node scripts/release/validate-owner-decision-workspace.cjs --fixture-dir scripts/release/fixtures/owner-workspace
          node tools/catalog-owner-decision-workspace/scripts/run-unit-tests.cjs
          node tools/catalog-owner-decision-workspace/scripts/assert-no-write-api.cjs
          echo "release_governance_gates=ok"
      - name: Seal checked source after all gates
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          MODE: ${{ inputs.release_mode }}
          POLICY_ID: ${{ inputs.storefront_runtime_policy }}
          TRUSTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ inputs.production_base_sha }}
          BE_DIGEST: ${{ inputs.backend_digest }}
          BE_REVISION: ${{ inputs.backend_revision }}
          SF_BASE_DIGEST: ${{ inputs.production_storefront_digest }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${MODE}" = "isolated_storefront"
          test -n "${POLICY_ID}"
          printf '%s\n' "${RELEASE_REF}" | grep -Eq '^release/[A-Za-z0-9][A-Za-z0-9._/-]*$'
          ! printf '%s\n' "${RELEASE_REF}" | grep -q '\.\.'
          test "$(git -C . rev-parse HEAD)" = "${TRUSTED_SHA}"
          git -C . diff --exit-code HEAD --
          git -C .runtime-source fetch --no-tags origin "refs/heads/${RELEASE_REF}:refs/remotes/origin/${RELEASE_REF}"
          node ./scripts/release/validate-isolated-storefront-bake.cjs \
            --qualification-only --post-checks --qualification-job release-governance \
            --release-mode isolated_storefront --runtime-policy "${POLICY_ID}" \
            --trusted-policy-sha "${TRUSTED_SHA}" --source-sha "${SOURCE_SHA}" \
            --production-base-sha "${BASE_SHA}" \
            --backend-digest "${BE_DIGEST}" --backend-revision "${BE_REVISION}" \
            --production-storefront-digest "${SF_BASE_DIGEST}" \
            --release-ref "${RELEASE_REF}" --repo "${GITHUB_WORKSPACE}/.runtime-source" \
            --evidence-output "${GITHUB_WORKSPACE}/qualification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-qualification-${{ github.run_id }}-${{ github.run_attempt }}-release-governance
          path: qualification.json
          if-no-files-found: error
