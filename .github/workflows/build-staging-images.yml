# Build and push Woodright staging images to GHCR (SHA-tagged).
# Manual only — does not deploy to Dokploy or production.
name: Build staging images

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Exact commit SHA to build (immutable). Leave empty for the workflow ref SHA."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/saintgroovie/woodright

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve and validate SHA
        id: sha
        env:
          INPUT_SHA: ${{ inputs.git_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA}" ]; then
            CANDIDATE="${INPUT_SHA}"
          else
            CANDIDATE="${FALLBACK_SHA}"
          fi
          # Full 40-char commit SHA only — blocks injection and unsafe Docker tags.
          if ! printf '%s' "${CANDIDATE}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Invalid git_sha: must be a full 40-char hex commit SHA" >&2
            exit 1
          fi
          echo "sha=${CANDIDATE}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.sha.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}-backend:sha-${{ steps.sha.outputs.sha }}
          provenance: false

      - name: Build and push storefront
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/storefront/Dockerfile
          push: true
          # Staging IP/http placeholders — override at Dokploy with real staging URLs via rebuild or runtime where possible.
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://127.0.0.1:9000
            MEDUSA_BACKEND_URL=http://backend:9000
            NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3002
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=
            NEXT_PUBLIC_CATALOG_CARD_DERIVATIVES=0
          tags: |
            ${{ env.IMAGE_PREFIX }}-storefront:${{ steps.sha.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}-storefront:sha-${{ steps.sha.outputs.sha }}
          provenance: false

      - name: Record digests
        run: |
          set -euo pipefail
          SHA="${{ steps.sha.outputs.sha }}"
          echo "backend=${{ env.IMAGE_PREFIX }}-backend:${SHA}"
          echo "storefront=${{ env.IMAGE_PREFIX }}-storefront:${SHA}"
          docker buildx imagetools inspect "${{ env.IMAGE_PREFIX }}-backend:${SHA}" | head -n 20
          docker buildx imagetools inspect "${{ env.IMAGE_PREFIX }}-storefront:${SHA}" | head -n 20
