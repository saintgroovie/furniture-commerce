services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medusa_network

  medusa:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      network: host
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "9000:9000"
      - "5173:5173"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa-store?sslmode=disable
      REDIS_URL: redis://redis:6379
    env_file:
      - ./apps/backend/.env
    volumes:
      - ./apps/backend:/server
      - medusa_node_modules:/server/node_modules
    networks:
      - medusa_network

  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
      network: host
    container_name: medusa_storefront
    restart: unless-stopped
    depends_on:
      - medusa
    ports:
      - "8000:8000"
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_BACKEND_URL: http://medusa:9000
    env_file:
      - ./apps/storefront/.env.local
    volumes:
      - ./apps/storefront:/app
      - storefront_node_modules:/app/node_modules
      - storefront_next:/app/.next
    networks:
      - medusa_network

volumes:
  postgres_data:
  medusa_node_modules:
  storefront_node_modules:
  storefront_next:

networks:
  medusa_network:
    driver: bridge
